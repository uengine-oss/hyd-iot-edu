## hyd-iot-edu 의 공장 쪽 브리지(ot-bridge) — compose 가 이 폴더를 /mosquitto/config 로 붙인다.
##
## 하는 일: 공장(OT) 안에서 바깥으로 「먼저 접속하는」 쪽이다. 두 곳에 스스로 접속해 그 사이를 잇는다.
##   다리 broker  공장 브로커(ot-broker:1883, OT 망) — 측정값 · 파형 · 설비 상태를 받아 오고, 승인된 명령 · 경보판을 넘긴다
##   다리 dmz     DMZ 브로커(dmz-broker:1883, 경계 망 ot-dmz-net) — 받아 온 값을 내보내고, 명령 관문이 검증해 둔 명령 · 경보판을 가져온다
## 그래서 값도 명령도 연결을 여는 쪽은 늘 공장이다. DMZ · IT 의 어떤 서비스도 공장 안으로 연결을 열 수 없다:
##   - 공장 브로커(ot-broker)는 경계 망에 붙지 않는다(compose.yaml).
##   - 경계 망에 나와 있는 공장 쪽 부품은 이 브리지 하나이고, 이 브리지는 바깥에서 들어오는 입구가 없다(아래 listener 는 이 컨테이너 안 127.0.0.1 에만 열린다 —
##     상태 확인용). 판정은 workspace/개발/tests/test_zones.py(실제로 연결을 열어 본다).
## 토픽마다 방향은 하나뿐이다(값은 올라가기만, 명령 · 경보판은 내려가기만) — 되돌아 도는 길이 없다.
## 끊긴 동안 온 명령은 다시 이어져도 내려가지 않는다(cleansession true — 명령 관문이 이미 「못 보냄」으로 적은 명령이 뒤늦게 설비에 닿지 않게).
## 다리의 상태는 bridge/ot/broker · bridge/ot/dmz 토픽(1 = 이어짐, 0 = 끊김, 보존)으로 DMZ 브로커에 올라간다. 수집 중계와 명령 관문이 이 값을 읽어
## /healthz 로 말하므로(hydcommon/mqtt.py), 다리가 끊기면 「응답 있음」인 채 값만 멈추는 일이 없다. 이 컨테이너의 상태 확인도 두 다리가 모두 1 일 때만 통과한다.

listener 1883 127.0.0.1
allow_anonymous true
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages false

connection broker
address ot-broker:1883
remote_username ot-bridge
remote_clientid ot-bridge
local_clientid ot-bridge-broker
bridge_protocol_version mqttv50
try_private false
cleansession true
keepalive_interval 5
restart_timeout 1 5
notifications true
notifications_local_only true
notification_topic bridge/ot/broker
topic plant/+/tag/+ in 0
topic plant/+/wave/+ in 0
topic plant/+/status in 1
topic plant/+/cmd/auto out 1
topic plant/+/alert out 1

connection dmz
address dmz-broker:1883
remote_username ot-bridge
remote_clientid ot-bridge
local_clientid ot-bridge-dmz
bridge_protocol_version mqttv50
try_private false
cleansession true
keepalive_interval 5
restart_timeout 1 5
notifications true
notification_topic bridge/ot/dmz
topic plant/+/tag/+ out 0
topic plant/+/wave/+ out 0
topic plant/+/status out 1
topic bridge/ot/broker out 1
topic plant/+/cmd/auto in 1
topic plant/+/alert in 1
