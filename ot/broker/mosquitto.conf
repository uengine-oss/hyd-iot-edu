## hyd-iot-edu 의 공장 브로커(ot-broker) — compose 가 이 폴더를 /mosquitto/config 로 붙인다. 입구 · 토픽 규칙은 이 폴더 한 곳에서 정한다.
##
## 하는 일: 공장(OT) 안에서 센서값 · 설비 상태 · 명령을 중계한다. OT 망에만 붙고 PC 에도 입구를 열지 않는다(compose.yaml) — DMZ · IT 의
##   어떤 서비스도 이 브로커에 닿지 못한다. 공장 밖과 이어지는 길은 공장 쪽 브리지(ot-bridge) 하나다. 브리지가 이 브로커와 DMZ 브로커 양쪽에
##   스스로 접속해 값을 내보내고 명령 · 경보판을 가져온다(ot/bridge/mosquitto.conf).
##   이 PC 의 Docker 는 PC 에 연 입구를 다른 망의 컨테이너도 그 컨테이너 주소로 닿게 두므로, 이 브로커가 PC 에 입구를 하나라도 열면
##   DMZ · IT 의 컨테이너가 공장 안으로 연결을 열 수 있게 된다(판정은 workspace/개발/tests/test_zones.py). 이 PC 의 프로그램이 MQTT 로
##   값을 구독하는 입구는 두지 않는다 — 쓰는 곳이 없었다(2026-11-24). 다시 둔다면 공장이 아니라 DMZ 브로커에 읽기만 되게 둔다.
##
## 입구는 1883 하나다 — OT 망의 서비스(plant-sim · FUXA · 공장 쪽 브리지 ot-bridge)만 닿는다. 비밀번호 없이 이름(username)만 대고,
##   이 이름이 토픽 규칙(acl)의 주체다.
## 토픽 규칙(acl): 설비 명령 plant/+/cmd/auto 는 공장 쪽 브리지만 낸다(DMZ 의 명령 관문이 검증해 DMZ 브로커에 놓은 것을 옮긴다 — DMZ
##   브로커에서는 명령 관문만 그 토픽에 놓을 수 있다, dmz/broker/acl), 수동 조작 · 모드는 FUXA 만, 측정값 · 상태는 plant-sim 만 보낸다.
##   그래서 「승인 1회 뒤에만 설비가 움직인다」가 브로커에서도 참이다.
## 허락되지 않은 발행은 버린다. MQTT 5 로 붙은 클라이언트에는 PUBACK 「Not authorized」(0x87)로 거절을 알린다.
## 관리 화면 · 관리 API 는 없다 — 토픽 규칙을 거치지 않고 메시지를 낼 길은 위 입구 밖에 없다(판정은 workspace/개발/tests/test_ot_broker.py).
## 메시지를 디스크에 남기지 않는다(persistence false). 브로커 로그는 `docker compose logs ot-broker`, 지나가는 값은 관제 화면이나
##   `docker compose exec ot-broker mosquitto_sub -h 127.0.0.1 -u fuxa -t 'plant/#' -v` 로 본다.

listener 1883
allow_anonymous true
acl_file /mosquitto/config/acl
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages false
