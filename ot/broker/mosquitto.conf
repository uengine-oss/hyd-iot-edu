## hyd-iot-edu 의 공장 브로커(ot-broker) — compose 가 이 폴더를 /mosquitto/config 로 붙인다. 입구 · 계정 · 토픽 규칙은 이 폴더 한 곳에서 정한다.
##
## 하는 일: 공장(OT) 안에서 센서값 · 설비 상태 · 명령을 중계한다. OT 망에만 붙는다(compose.yaml) — DMZ · IT 의 어떤 서비스도 이 브로커에 닿지 못한다.
##   공장 밖과 이어지는 길은 공장 쪽 브리지(ot-bridge) 하나다. 브리지가 이 브로커와 DMZ 브로커 양쪽에 스스로 접속해 값을 내보내고
##   명령 · 경보판을 가져온다(ot/bridge/mosquitto.conf).
##
## 입구 셋(입구마다 인증이 다르다 — per_listener_settings):
##   1883        안쪽 입구 — OT 망의 서비스(plant-sim · FUXA · 공장 쪽 브리지 ot-bridge)만 닿는다(호스트에도 경계 망에도 열지 않는다).
##               비밀번호 없이 이름(username)만 댄다. 이 이름이 토픽 규칙(acl)의 주체다.
##   1884 · 8083 바깥 입구 — 호스트 포트 1883(MQTT) · 8083(WebSocket)으로 열린다. 계정 student(비밀번호 student)만 들어온다 — 계정 파일
##               passwd 에 student 하나뿐이라 서비스 이름으로는 들어올 수 없다(passwd 는 mosquitto_passwd 로 만든 것이다. 비밀번호는 공개 값이다).
## 토픽 규칙(acl — 세 입구가 같은 파일을 쓴다): 설비 명령 plant/+/cmd/auto 는 공장 쪽 브리지만 낸다(DMZ 의 명령 관문이 검증해 DMZ 브로커에 놓은
##   것을 옮긴다 — DMZ 브로커에서는 명령 관문만 그 토픽에 놓을 수 있다, dmz/broker/acl), 수동 조작 · 모드는 FUXA 만, 측정값 · 상태는 plant-sim 만
##   보낸다. 그래서 「승인 1회 뒤에만 설비가 움직인다」가 브로커에서도 참이다 — 학생 PC 의 다른 프로그램 · 웹 페이지는 구독만 한다.
## 허락되지 않은 발행은 버린다. MQTT 5 로 붙은 클라이언트에는 PUBACK 「Not authorized」(0x87)로 거절을 알린다.
## 관리 화면 · 관리 API 는 없다 — 토픽 규칙을 거치지 않고 메시지를 낼 길은 위 입구 셋 밖에 없다(판정은 workspace/개발/tests/test_ot_broker.py).
## 메시지를 디스크에 남기지 않는다(persistence false). 브로커 로그는 `docker compose logs ot-broker`, 지나가는 값은 관제 화면이나
##   `docker compose exec ot-broker mosquitto_sub -h 127.0.0.1 -u fuxa -t 'plant/#' -v` 로 본다.

per_listener_settings true
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages false

listener 1883
allow_anonymous true
acl_file /mosquitto/config/acl

listener 1884
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

listener 8083
protocol websockets
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
