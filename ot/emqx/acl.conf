%% hyd-iot-edu 토픽 규칙 — 위에서부터 처음 맞는 줄이 이긴다. 맞는 줄이 없으면 거절(emqx.conf: no_match = deny).
%% 주체(username): 안쪽 입구의 서비스 이름(hydcommon.mqtt · FUXA 장치 설정) · 바깥 입구의 student.
{allow, {username, "plant-sim"}, publish, ["plant/+/tag/+", "plant/+/wave/+", "plant/+/status"]}.
{allow, {username, "plant-sim"}, subscribe, ["plant/+/cmd/manual", "plant/+/cmd/auto", "plant/+/mode"]}.
{allow, {username, "cmd-gateway"}, publish, ["plant/+/cmd/auto", "plant/+/alert"]}.
{allow, {username, "cmd-gateway"}, subscribe, ["plant/+/status", "plant/+/alert"]}.
{allow, {username, "connect-ingest"}, subscribe, ["plant/+/tag/+", "plant/+/wave/+", "plant/+/status"]}.
{allow, {username, "fuxa"}, publish, ["plant/+/cmd/manual", "plant/+/mode"]}.
{allow, {username, "fuxa"}, subscribe, ["plant/#"]}.
{allow, {username, "student"}, subscribe, ["#"]}.
{deny, all}.
