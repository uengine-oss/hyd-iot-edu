## hyd-iot-edu 의 EMQX 설정 — compose 가 이 폴더를 /opt/emqx/etc/hyd 로, 이 파일을 /opt/emqx/etc/emqx.conf 로 붙인다.
## 브로커의 입구 · 계정 · 토픽 규칙은 이 폴더 한 곳에서 정한다(우선순위: 대시보드에서 바꾼 값 < 이 파일 < 환경 변수).
##
## 입구 둘:
##   1883        안쪽 입구 — OT 망(plant-sim · FUXA)과 경계 망 ot-dmz-net(cmd-gateway · connect-ingest)의 서비스만 닿는다(호스트에 열지 않는다).
##               비밀번호 없이 이름(username)만 댄다. 이 이름이 토픽 규칙의 주체다.
##   1884 · 8083 바깥 입구 — 호스트 포트 1883(MQTT) · 8083(WebSocket)으로 열린다. 계정 student(비밀번호 student)만 들어온다.
##               서비스 이름으로는 들어올 수 없다(계정 목록 users.csv 에 student 하나뿐).
## 토픽 규칙(acl.conf): 설비 명령 plant/+/cmd/auto 는 cmd-gateway 만, 수동 조작 · 모드는 FUXA 만, 측정값 · 상태는 plant-sim 만 보낸다.
## 그래서 「승인 1회 뒤에만 설비가 움직인다」가 브로커에서도 참이다 — 학생 PC 의 다른 프로그램 · 웹 페이지는 구독만 한다.
## 허락되지 않은 발행은 그 연결을 끊는다(deny_action = disconnect) — 조용히 버려 명령이 사라진 것처럼 보이지 않게.
## 관리 화면 · 관리 API(18083)는 끈다(dashboard 의 bind = 0). 관리 API 의 발행(POST /api/v5/publish)은 위 토픽 규칙을 거치지 않아, 공개된
## 초기 비밀번호로 들어온 누구나 plant/+/cmd/auto 를 낼 수 있었고 설비가 그 명령을 실행했다(2026-11-14 실측). 브로커 상태는
## `docker compose exec emqx emqx ctl status` · `emqx ctl clients list` 로 본다.

node {
  name = "emqx@127.0.0.1"
  cookie = "emqxsecretcookie"
  data_dir = "data"
}

cluster {
  name = emqxcl
  discovery_strategy = manual
}

dashboard {
  listeners.http.bind = 0
}

listeners.tcp.default {
  bind = "0.0.0.0:1883"
  enable_authn = false
}
listeners.tcp.student {
  bind = "0.0.0.0:1884"
}
listeners.ws.default {
  bind = "0.0.0.0:8083"
}
listeners.ssl.default.enable = false
listeners.wss.default.enable = false

authentication = [
  {
    mechanism = password_based
    backend = built_in_database
    user_id_type = username
    password_hash_algorithm { name = sha256, salt_position = suffix }
    bootstrap_file = "${EMQX_ETC_DIR}/hyd/users.csv"
    bootstrap_type = plain
  }
]

authorization {
  no_match = deny
  deny_action = disconnect
  sources = [
    { type = file, enable = true, path = "${EMQX_ETC_DIR}/hyd/acl.conf" }
  ]
}
