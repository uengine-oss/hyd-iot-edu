## hyd-iot-edu 의 DMZ 브로커(dmz-broker) — compose 가 이 폴더를 /mosquitto/config 로 붙인다.
##
## 하는 일: 공장과 바깥이 만나는 자리. 이 브로커는 어디에도 먼저 접속하지 않고 기다리기만 한다.
##   - 공장 쪽 브리지(ot-bridge)가 접속해 와서 측정값 · 파형 · 설비 상태를 내놓고, 여기 놓인 명령 · 경보판을 가져간다.
##   - 수집 중계(connect-ingest)는 여기서 값을 꺼내 이벤트 저장으로 보내고, 명령 관문(cmd-gateway)은 검증을 통과한 명령과 경보판을 여기에 놓는다.
## 입구는 1883 하나이고 경계 망 ot-dmz-net 에만 열린다(호스트에도 IT 망에도 열지 않는다). 공장 브로커의 안쪽 입구와 같이 비밀번호 없이
## 이름(username)만 대고, 그 이름이 토픽 규칙(acl)의 주체다 — 설비 명령 plant/+/cmd/auto 는 여기서도 명령 관문만 놓을 수 있다.
## 메시지를 디스크에 남기지 않는다(persistence false).

listener 1883
allow_anonymous true
acl_file /mosquitto/config/acl
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages false
