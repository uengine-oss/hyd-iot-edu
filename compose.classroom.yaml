# Instructor server override, not a student setting. Apply with compose.yaml.
# Public HTTPS ingress must target only 127.0.0.1:8188. Do not expose process,
# Supabase, the worker or the internal gateway listener.
# Migration 65, approved-source archive and instructor grants must exist first.
services:
  process:
    environment:
      TENANT_ID: hyd
      HYD_CLASSROOM_AUTHORITY_ENABLED: "1"
      HYD_CLASSROOM_AGENT_ENABLED: ${HYD_CLASSROOM_AGENT_ENABLED:-0}
      HYD_CLASSROOM_AUTHORITY_DSN: ${HYD_CLASSROOM_AUTHORITY_DSN:?Instructor authority DSN required}
      HYD_CLASSROOM_UPSTREAM_URL: ${LLM_RELAY_URL:?Instructor upstream URL required}
      HYD_CLASSROOM_UPSTREAM_KEY_FILE: /run/secrets/classroom_upstream
      HYD_WORKER_RUNTIME_KEY_FILE: /run/secrets/classroom_worker_runtime
      HYD_CLASSROOM_URL: ""
      LLM_API_KEY: ""
    secrets: [classroom_upstream, classroom_worker_runtime]
  agent-worker:
    environment:
      HYD_MANAGED_MODEL_REQUIRED: "1"
      HYD_CLASSROOM_URL: ""
      HYD_MANAGED_MODEL_URL: http://classroom:8081
      HYD_WORKER_RUNTIME_KEY_FILE: /run/secrets/classroom_worker_runtime
      ANTHROPIC_API_KEY: ""
      ANTHROPIC_AUTH_TOKEN: ""
      OPENAI_API_KEY: ""
      LLM_API_KEY: ""
    secrets: [classroom_worker_runtime]
  classroom:
    image: nginx:1.27-alpine
    profiles: [classroom]
    restart: unless-stopped
    mem_limit: 64m
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    networks: [it-net]
    ports: ["127.0.0.1:${HYD_CLASSROOM_PORT:-8188}:8080"]
    volumes:
      - ./it/classroom/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      process: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
secrets:
  classroom_upstream:
    file: ${HYD_CLASSROOM_UPSTREAM_KEY_FILE:?Instructor upstream key file required}
  classroom_worker_runtime:
    file: ${HYD_CLASSROOM_WORKER_KEY_FILE:?Instructor worker runtime key file required}
