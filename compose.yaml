# hyd-iot-edu — 유압설비 IoT-SCADA 학생용 프로토타입 (v3 아키텍처 L1~L9)
# 프로필: ot · backbone · detect · knowledge · agent · enterprise · process (기본, .env COMPOSE_PROFILES)
#         monitor(Prometheus) · tools(Redpanda Console) 는 선택 — 경량 기본 구성에서 뺐다. 필요하면 COMPOSE_PROFILES에 추가.
name: hyd-iot-edu

x-logging: &log                          # 컨테이너 로그가 디스크(WSL vhdx)를 키우지 않게 순환
  driver: json-file
  options: { max-size: "5m", max-file: "2" }

x-py-health: &py-health
  interval: 5s
  timeout: 3s
  retries: 30
  start_period: 10s

networks:
  ot-net: {}
  it-net: {}

volumes:
  tsdb-data: {}
  neo4j-data: {}
  redpanda-data: {}
  process-data: {}
  detector-data: {}
  enterprise-data: {}
  worker-data: {}                          # agent-worker: 인스턴스별 작업공간 · Claude Code 세션 (재시작 뒤 resume)
  effects-data: {}                         # C2 effects-mcp: 쓰기 도구 멱등 키 기록

services:
  # ───────────────────────────── OT (ot-net) ─────────────────────────────
  emqx:                                   # L2 IoT 미들웨어 · MQTT 브로커
    restart: unless-stopped
    logging: *log
    mem_limit: 320m
    image: emqx/emqx:5.8
    profiles: [ot]
    networks: [ot-net]
    ports: ["127.0.0.1:1883:1883", "127.0.0.1:18083:18083", "127.0.0.1:8083:8083"]   # 8083 = MQTT over WebSocket (A148: 03회차 대시보드 WebSocket Client 구독용)
    environment:
      EMQX_DASHBOARD__DEFAULT_PASSWORD: public123   # 8자 이상 필수. 첫 로그인 때 변경을 요구하면 새 값으로 바꾸고 기억해 둘 것
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  plant-sim:                              # L1 유압설비 3기 + soft-PLC + DAQ (EdgeX 역할 포함)
    restart: unless-stopped
    logging: *log
    mem_limit: 96m
    build: { context: ., dockerfile: ot/plant-sim/Dockerfile }
    profiles: [ot]
    networks: [ot-net]
    ports: ["127.0.0.1:8000:8000"]
    environment:
      MQTT_HOST: emqx
      TIME_SCALE: ${TIME_SCALE:-20}
      DAQ_PROFILE: ${DAQ_PROFILE:-lite}      # lite: 예외 보고(데드밴드·하트비트), 파형 없음 · full: 전 태그 1 Hz + 100 Hz 파형
    depends_on:
      emqx: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      <<: *py-health

  fuxa:                                   # L6(OT) 웹 SCADA
    restart: unless-stopped
    logging: *log
    mem_limit: 192m
    image: frangoteam/fuxa:latest
    profiles: [ot]
    networks: [ot-net]
    ports: ["127.0.0.1:1881:1881"]
    depends_on:
      emqx: { condition: service_healthy }

  fuxa-init:                              # FUXA 프로젝트(태그·뷰·알람) 자동 주입
    logging: *log
    mem_limit: 64m
    image: python:3.12-slim
    profiles: [ot]
    networks: [ot-net]
    volumes: ["./ot/fuxa:/work:ro"]
    command: ["python", "/work/init.py"]
    depends_on: [fuxa]
    restart: "no"


  # ───────────────────────────── DMZ (ot-net + it-net) ─────────────────────────────
  connect-ingest:                         # L3 DMZ: OT MQTT → Kafka 단방향 복제
    restart: unless-stopped
    logging: *log
    mem_limit: 128m
    build: { context: ., dockerfile: dmz/connect-ingest/Dockerfile }
    profiles: [backbone]
    networks: [ot-net, it-net]
    ports: ["127.0.0.1:8093:8093"]
    environment:
      MQTT_HOST: emqx
      KAFKA_BOOTSTRAP: redpanda:9092
      CMD_FINGERPRINT_KEY: ${CMD_FINGERPRINT_KEY:-hyd-cmd-approval-local}   # A148 check ⑤: must equal process's key (approval ledger HMAC)
    depends_on:
      redpanda: { condition: service_healthy }
      topic-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8093/healthz')"]
      <<: *py-health

  cmd-gateway:                            # L3 DMZ: Kafka action.cmd/alerts → OT (검증 5종) — 유일한 하향 통로
    restart: unless-stopped
    logging: *log
    mem_limit: 128m
    build: { context: ., dockerfile: dmz/cmd-gateway/Dockerfile }
    profiles: [detect]
    networks: [ot-net, it-net]
    ports: ["127.0.0.1:8090:8090"]
    environment:
      MQTT_HOST: emqx
      KAFKA_BOOTSTRAP: redpanda:9092
    depends_on:
      redpanda: { condition: service_healthy }
      topic-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8090/healthz')"]
      <<: *py-health

  # ───────────────────────────── IT (it-net) ─────────────────────────────
  redpanda:                               # L3 이벤트 백본 (Kafka API 호환)
    restart: unless-stopped
    logging: *log
    mem_limit: 448m
    image: redpandadata/redpanda:v24.2.7
    profiles: [backbone]
    networks: [it-net]
    command:
      - redpanda start
      - --mode dev-container
      - --smp 1
      - --memory 320M
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports: ["127.0.0.1:19092:19092", "127.0.0.1:9644:9644"]
    volumes: ["redpanda-data:/var/lib/redpanda/data"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  topic-init:                             # Kafka 토픽 7개 생성 (v3 5.2절)
    logging: *log
    mem_limit: 128m
    image: redpandadata/redpanda:v24.2.7
    profiles: [backbone]
    networks: [it-net]
    entrypoint: ["/bin/bash", "/topics.sh"]
    volumes: ["./it/redpanda/topics.sh:/topics.sh:ro"]
    depends_on:
      redpanda: { condition: service_healthy }
    restart: "no"

  redpanda-console:                       # L3 진입점: 토픽·메시지 브라우저 (선택: tools 프로필)
    restart: unless-stopped
    logging: *log
    mem_limit: 128m
    image: redpandadata/console:v2.7.2
    profiles: [tools]
    networks: [it-net]
    ports: ["127.0.0.1:8085:8080"]
    environment:
      KAFKA_BROKERS: redpanda:9092
    depends_on:
      redpanda: { condition: service_healthy }

  timescaledb:                            # L5 시계열 저장소
    restart: unless-stopped
    logging: *log
    mem_limit: 256m
    image: timescale/timescaledb:2.17.2-pg16
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "work_mem=4MB", "-c", "max_connections=40",
              "-c", "timescaledb.max_background_workers=4", "-c", "max_worker_processes=10", "-c", "timescaledb.telemetry_level=off"]
    profiles: [backbone]
    networks: [it-net]
    ports: ["127.0.0.1:5432:5432"]
    environment:
      POSTGRES_USER: hyd
      POSTGRES_PASSWORD: hyd
      POSTGRES_DB: hyd
    volumes:
      - tsdb-data:/var/lib/postgresql/data
      - ./it/timescaledb/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./it/timescaledb/reader.sql:/docker-entrypoint-initdb.d/reader.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hyd -d hyd"]
      interval: 5s
      timeout: 5s
      retries: 30

  connect-sink:                           # L5 Kafka → TimescaleDB 적재 (JDBC Sink 역할)
    restart: unless-stopped
    logging: *log
    mem_limit: 128m
    build: { context: ., dockerfile: it/connect-sink/Dockerfile }
    profiles: [backbone]
    networks: [it-net]
    ports: ["127.0.0.1:8094:8094"]
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
      CMD_FINGERPRINT_KEY: ${CMD_FINGERPRINT_KEY:-hyd-cmd-approval-local}   # A148: approval ledger HMAC key shared with cmd-gateway
      PG_DSN: postgresql://hyd:hyd@timescaledb:5432/hyd
    depends_on:
      redpanda: { condition: service_healthy }
      timescaledb: { condition: service_healthy }
      topic-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8094/healthz')"]
      <<: *py-health

  grafana:                                # L6(IT) 설비 추세 · 조치 주석
    restart: unless-stopped
    logging: *log
    mem_limit: 192m
    image: grafana/grafana:11.3.0
    profiles: [backbone]
    networks: [it-net]
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: light
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/hyd-trend.json
    volumes:
      - ./it/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      timescaledb: { condition: service_healthy }

  detector:                               # L4 스트림 처리 · CEP (Flink 역할)
    restart: unless-stopped
    logging: *log
    mem_limit: 256m
    build: { context: ., dockerfile: it/detector/Dockerfile }
    profiles: [detect]
    networks: [it-net]
    ports: ["127.0.0.1:8092:8092"]
    volumes: ["detector-data:/data"]
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
      TIME_SCALE: ${TIME_SCALE:-20}
      DAQ_PROFILE: ${DAQ_PROFILE:-lite}
      OBSERVATION_GRACE_S: ${OBSERVATION_GRACE_S:-2}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_AUTH: neo4j/hydpass123
      DETECTOR_STATE_PATH: ${DETECTOR_STATE_PATH:-/data/detector.sqlite3}   # 다른 시간 배율로 돌릴 때는 별도 파일을 지정한다(기존 상태 파일 보존; A072)
    depends_on:
      redpanda: { condition: service_healthy }
      topic-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8092/healthz')"]
      <<: *py-health

  prometheus:                             # L6 플랫폼 감시 (선택)
    restart: unless-stopped
    logging: *log
    mem_limit: 128m
    image: prom/prometheus:v2.55.1
    profiles: [monitor]
    networks: [it-net]
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./it/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./it/prometheus/rules.yml:/etc/prometheus/rules.yml:ro

  neo4j:                                  # L7 온톨로지 지식 그래프
    restart: unless-stopped
    logging: *log
    mem_limit: 1536m                      # APOC schema discovery + v2 query plans
    image: neo4j:5.26-community
    profiles: [knowledge]
    networks: [it-net]
    ports: ["127.0.0.1:7474:7474", "127.0.0.1:7687:7687"]
    environment:
      NEO4J_AUTH: neo4j/hydpass123
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.meta.*
      NEO4J_server_memory_heap_initial__size: 128m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 48m
      NEO4J_server_jvm_additional: "-XX:MaxMetaspaceSize=384m"
      NEO4J_server_memory_query__cache_per__db__cache__num__entries: "100"   # fewer cached plans = less metaspace (default 1000)
      NEO4J_db_tx__log_rotation_retention__policy: "1 files"
    volumes: ["neo4j-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/7687' || exit 1"]   # Bolt port probe: no extra JVM (cypher-shell) inside the memory cap
      interval: 5s
      timeout: 10s
      retries: 40
      start_period: 20s

  kg-seed:                                # 온톨로지 스키마·인스턴스 적재 (멱등)
    logging: *log
    mem_limit: 384m
    image: neo4j:5.26-community
    profiles: [knowledge]
    networks: [it-net]
    entrypoint: ["/bin/bash", "/seed/seed.sh"]
    environment:
      SEED_EDITION: ${SEED_EDITION:-structure}   # 확정 TODO C1: structure 수업용 구조판(강의 기본, 고장 · 조치 지식은 문서 적재) | full 회귀용 전체판(회귀 · 통합 시험)
    volumes: ["./it/neo4j:/seed:ro"]
    depends_on:
      neo4j: { condition: service_healthy }
    restart: "no"

  agent:                                  # L8 AI 에이전트 (한 프로세스 안의 읽기 전용 도구 모듈 mcp_kg·mcp_tsdb·mcp_prom·mcp_ent — MCP 서버 아님; 실제 MCP 서버는 dmn-mcp·enterprise-mcp)
    restart: unless-stopped
    logging: *log
    mem_limit: 192m
    build: { context: ., dockerfile: it/agent/Dockerfile }
    profiles: [agent]
    networks: [it-net]
    ports: ["127.0.0.1:8091:8091"]
    environment:
      PROCESS_MODE: ${PROCESS_MODE:-legacy}
      KAFKA_BOOTSTRAP: redpanda:9092
      TSDB_DSN: ${TSDB_READ_DSN:-postgresql://hyd_timeseries_reader:hyd-timeseries-read-local@timescaledb:5432/hyd}
      DAQ_PROFILE: ${DAQ_PROFILE:-lite}     # Evidence 구간 공백 한도 = 감지기와 같은 수집 계약 (A083)
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_AUTH: neo4j/hydpass123
      PROCESS_URL: http://process:8080
      ENTERPRISE_URL: http://enterprise-sim:8095
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ENTERPRISE_READ_DSN: ${ENTERPRISE_READ_DSN:-postgresql://hyd_enterprise_reader:hyd-enterprise-read-local@host.docker.internal:54322/postgres}
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      LLM_MODEL: ${LLM_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}                 # key for OPENAI_BASE_URL when it is a GPU/LiteLLM endpoint (A073)
      LLM_EXTRA_BODY: ${LLM_EXTRA_BODY:-}           # vendor request fields, e.g. {"chat_template_kwargs":{"enable_thinking":false}} for SGLang/Qwen
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-8}
    extra_hosts: ["host.docker.internal:host-gateway"]   # ENTERPRISE_READ_DSN points at the host Supabase; Docker Desktop resolves the name by itself, Linux Engine only with this
    depends_on:
      kg-seed: { condition: service_completed_successfully }
      connect-sink: { condition: service_healthy }
      process: { condition: service_healthy }
      enterprise-sim: { condition: service_healthy }
      redpanda: { condition: service_healthy }
      topic-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8091/healthz')"]
      <<: *py-health

  process:                                # L9 프로세스 엔진 (미니 BPMN: 승인 → action.cmd → ACK → 재관측 → 종결)
    restart: unless-stopped
    logging: *log
    mem_limit: ${PROCESS_MEM_LIMIT:-512m}
    build: { context: ., dockerfile: it/process/Dockerfile }
    profiles: [process]
    networks: [it-net, ot-net]            # ot-net: 정비 수행 모사가 plant-sim 을 서비스 이름(plant-sim:8000)으로 부른다 (Linux 에서 호스트 루프백 불가)
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["process-data:/data"]
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
      PG_DSN: postgresql://hyd:hyd@timescaledb:5432/hyd
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_AUTH: neo4j/hydpass123
      TIME_SCALE: ${TIME_SCALE:-20}
      ENTERPRISE_URL: http://enterprise-sim:8095
      # instance 모드(docs/HANDOFF.md): 경보가 프로세스 인스턴스를 열고 에이전트·사람은 그 안의 태스크. Supabase(supabase start)가 필요하다.
      PROCESS_MODE: ${PROCESS_MODE:-legacy}
      PROCESS_REPO: ${PROCESS_REPO:-pg}
      SUPABASE_DSN: ${SUPABASE_DSN:-postgresql://postgres:postgres@host.docker.internal:54322/postgres}
      # A11 데이터 패브릭(/api/fabric/*): 쓰기 연결이 아니라 두 전용 읽기 계정만 쓴다
      ENTERPRISE_READ_DSN: ${ENTERPRISE_READ_DSN:-postgresql://hyd_enterprise_reader:hyd-enterprise-read-local@host.docker.internal:54322/postgres}
      TSDB_READ_DSN: ${TSDB_READ_DSN:-postgresql://hyd_timeseries_reader:hyd-timeseries-read-local@timescaledb:5432/hyd}
      AGENT_BRIDGE: ${AGENT_BRIDGE:-legacy}
      # 포털 "에이전트 현황": 워커의 /health · /agents. 컨테이너 워커면 agent-worker:8097, 강사 PC 워커(run_worker_host.sh)면 host.docker.internal:8097
      WORKER_URL: ${WORKER_URL:-http://agent-worker:8097}
      # A131: 1 mounts GET /debug/memory (tracemalloc · RSS · container sizes) for OOM diagnosis; off in the product default
      PROCESS_MEMDEBUG: ${PROCESS_MEMDEBUG:-0}
      # C2 승인 뒤 실행 부품 (docs/handoff/verification/2026-10-09/c2-execution.md)
      #   대기 압축: 시간 대기 · 입고 확인과 그 경계 타이머만 배속 × 이 배율 (60 → 20배속에서 납기 5일 = 6분). 설비 · 감지기 · 재관측은 배속만.
      PROCESS_WAIT_COMPRESSION: ${PROCESS_WAIT_COMPRESSION:-60}
      #   정비 수행 모사 = 실습 시뮬레이터 조작(현장 정비 대역). plant-sim 은 ot-net 에 있고 process 도 ot-net 에 붙어 있어 compose 서비스 이름으로 간다
      #   (호스트 포트 127.0.0.1:8000 은 Linux 컨테이너에서 닿지 않는다. Mac/Windows Docker Desktop 에서도 같은 값이 동작)
      PLANT_SIM_URL: ${PLANT_SIM_URL:-http://plant-sim:8000}
      #   승인 뒤 MCP 호출 서버 (기본 hyd-effects = effects-mcp). JSON {이름: tenants.mcp 와 같은 설정}
      EFFECT_MCP_SERVERS: ${EFFECT_MCP_SERVERS:-}
      #   ERP 재고 감시(재주문점 이탈 → 시나리오 C 처리 건). 0 이면 끔
      BUSINESS_MONITOR: ${BUSINESS_MONITOR:-1}
      BUSINESS_MONITOR_INTERVAL_S: ${BUSINESS_MONITOR_INTERVAL_S:-15}
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      redpanda: { condition: service_healthy }
      topic-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8080/healthz')"]
      <<: *py-health

  enterprise-sim:                         # L9 연계 대상: 기업 시스템 목업 (ERP · MES · CMMS · QMS · SCM · EMS)
    restart: unless-stopped
    logging: *log
    mem_limit: 96m
    build: { context: ., dockerfile: it/enterprise-sim/Dockerfile }
    profiles: [enterprise]
    networks: [it-net]
    ports: ["127.0.0.1:8095:8095"]
    environment:
      ENTERPRISE_STATE_PATH: /data/enterprise.sqlite3
      # memory(기본): data.py 딕셔너리 + SQLite 상태 · supabase: Supabase ent 스키마가 원천 (instance 모드와 함께 쓴다, API 계약은 같다)
      ENTERPRISE_BACKEND: ${ENTERPRISE_BACKEND:-memory}
      SUPABASE_DSN: ${SUPABASE_DSN:-postgresql://postgres:postgres@host.docker.internal:54322/postgres}
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["enterprise-data:/data"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8095/healthz')"]
      <<: *py-health

  effects-mcp:                            # C2: 사람 승인 뒤 시스템 task 가 부르는 쓰기 MCP (메일 → Inbucket · CMMS 일정 · 처리 건 기록). 에이전트에는 붙이지 않는다
    restart: unless-stopped
    logging: *log
    mem_limit: 128m
    build: { context: ., dockerfile: it/effects-mcp/Dockerfile }
    profiles: [process]
    networks: [it-net]
    ports: ["127.0.0.1:8197:8197"]
    environment:
      SMTP_HOST: ${EFFECTS_SMTP_HOST:-host.docker.internal}      # Supabase 로컬 Inbucket (it/supabase/config.toml [inbucket] smtp_port)
      SMTP_PORT: ${EFFECTS_SMTP_PORT:-54325}
      EFFECTS_STATE_PATH: /data/effects.sqlite3
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["effects-data:/data"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8197/healthz')"]
      <<: *py-health

  portal:                                 # L9 운전원 가이드 앱 · 설비 포탈 (정적 SPA)
    restart: unless-stopped
    logging: *log
    mem_limit: 32m
    image: nginx:1.27-alpine
    profiles: [process]
    networks: [it-net]
    ports: ["127.0.0.1:8088:80"]
    volumes:
      - ./it/portal/www:/usr/share/nginx/html:ro
      - ./it/portal/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  # ───────────────────────────── instance 모드 (docs/HANDOFF.md): 프로세스 인스턴스 · Claude Code 에이전트 · MCP ─────────────────────────────
  # 프로필 `cliagents` 는 기본 COMPOSE_PROFILES 에 없다. Supabase(cd it/supabase && supabase start)와 ANTHROPIC_API_KEY 가 있을 때 켠다.
  enterprise-mcp:                         # 업무 DB(Supabase ent 스키마)를 에이전트에게 읽기 전용 도구로 (WMS 예제의 wms-mcp 역할)
    restart: unless-stopped
    logging: *log
    mem_limit: 160m
    build: { context: ., dockerfile: it/enterprise-mcp/Dockerfile }
    profiles: [cliagents]
    networks: [it-net]
    ports: ["127.0.0.1:8199:8199"]
    environment:
      ENTERPRISE_DSN: ${ENTERPRISE_READ_DSN:-postgresql://hyd_enterprise_reader:hyd-enterprise-read-local@host.docker.internal:54322/postgres}
    extra_hosts: ["host.docker.internal:host-gateway"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8199/healthz')"]
      <<: *py-health

  enterprise-mcp-maint:                   # C2: 업무 MCP 보전용(정비 계획 · 운전시간 계수기 · 작업지시 · 생산 오더) — 같은 코드, 도구 묶음만 다름
    restart: unless-stopped
    logging: *log
    mem_limit: 160m
    build: { context: ., dockerfile: it/enterprise-mcp/Dockerfile }
    profiles: [cliagents]
    networks: [it-net]
    ports: ["127.0.0.1:8196:8196"]
    environment:
      ENTERPRISE_DSN: ${ENTERPRISE_READ_DSN:-postgresql://hyd_enterprise_reader:hyd-enterprise-read-local@host.docker.internal:54322/postgres}
      ENTERPRISE_MCP_TOOLSET: maintenance
      MCP_PORT: "8196"
    extra_hosts: ["host.docker.internal:host-gateway"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8196/healthz')"]
      <<: *py-health

  enterprise-mcp-purchase:                # C2: 업무 MCP 구매용(ERP 예비품 재고 · SCM 공급사 견적)
    restart: unless-stopped
    logging: *log
    mem_limit: 160m
    build: { context: ., dockerfile: it/enterprise-mcp/Dockerfile }
    profiles: [cliagents]
    networks: [it-net]
    ports: ["127.0.0.1:8195:8195"]
    environment:
      ENTERPRISE_DSN: ${ENTERPRISE_READ_DSN:-postgresql://hyd_enterprise_reader:hyd-enterprise-read-local@host.docker.internal:54322/postgres}
      ENTERPRISE_MCP_TOOLSET: purchasing
      MCP_PORT: "8195"
    extra_hosts: ["host.docker.internal:host-gateway"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8195/healthz')"]
      <<: *py-health

  dmn-mcp:                                # 결정론 판단 엔진(agentsvc cards · decide)을 MCP 도구로 — 반복 판단은 DMN, LLM 은 수집·설명
    restart: unless-stopped
    logging: *log
    mem_limit: 192m
    build: { context: ., dockerfile: it/dmn-mcp/Dockerfile }
    profiles: [cliagents]
    networks: [it-net]
    ports: ["127.0.0.1:8198:8198"]
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      TSDB_DSN: ${TSDB_READ_DSN:-postgresql://hyd_timeseries_reader:hyd-timeseries-read-local@timescaledb:5432/hyd}
      DAQ_PROFILE: ${DAQ_PROFILE:-lite}     # Evidence 구간 공백 한도 = 감지기와 같은 수집 계약 (A083)
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_AUTH: neo4j/hydpass123
      PROCESS_URL: http://process:8080
      ENTERPRISE_URL: http://enterprise-sim:8095
      INGEST_URL: http://connect-ingest:8093/healthz
      ENTERPRISE_READ_DSN: ${ENTERPRISE_READ_DSN:-postgresql://hyd_enterprise_reader:hyd-enterprise-read-local@host.docker.internal:54322/postgres}
    extra_hosts: ["host.docker.internal:host-gateway"]   # same reason as agent: physical InputData reads go to the host Supabase
    depends_on:
      kg-seed: { condition: service_completed_successfully }
      process: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8198/healthz')"]
      <<: *py-health

  agent-worker:                           # L8 에이전트 워커: todolist(agent_orch=cliagents) 를 집어 Claude Code 로 수행 (process-gpt-cli-agent 역할)
    restart: unless-stopped
    logging: *log
    mem_limit: 768m
    build: { context: ., dockerfile: it/agent-worker/Dockerfile }
    profiles: [cliagents]
    networks: [it-net]
    ports: ["127.0.0.1:8097:8097"]
    volumes: ["worker-data:/workspace"]
    environment:
      # the worker is the ProcessGPT agent type `cliagents` (process-gpt-cli-agent): it polls todolist through fetch_pending_task,
      # reads the tenant's MCP servers from tenants.mcp (seed.sql) and stores results with save_task_result.
      SUPABASE_DSN: ${SUPABASE_DSN:-postgresql://postgres:postgres@host.docker.internal:54322/postgres}
      TENANT_ID: hyd
      CONSUMER_ID: agent-worker:docker
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}                 # API key → the CLI authenticates itself and gets a private CLAUDE_CONFIG_DIR per run
      CLIAGENTS_DEFAULT_CLI: ${CLIAGENTS_DEFAULT_CLI:-claude-code}
      CLI_MODEL: ${CLI_MODEL:-}
      CLIAGENTS_DEFAULT_PERMISSION: ${CLIAGENTS_DEFAULT_PERMISSION:-workspace_write}
      CLIAGENTS_RUN_TIMEOUT_SECONDS: ${CLIAGENTS_RUN_TIMEOUT_SECONDS:-1800}
      CLIAGENTS_WORKSPACE_ROOT: /workspace
      ALLOWED_TOOLS: ${ALLOWED_TOOLS:-}                         # empty = worker/settings.py DEFAULT_ALLOWED_TOOLS (one list; it includes `python <file>` for the A077 script)
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      process: { condition: service_healthy }
      enterprise-mcp: { condition: service_healthy }
      dmn-mcp: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8097/healthz')"]
      <<: *py-health
