# hyd-iot-edu — 유압설비 IoT-SCADA 학생용 프로토타입 (v3 아키텍처 L1~L9)
# 기본 서비스는 모두 뜬다(프로필 없음). 학생 PC 구성(서비스 · 배속 · 메모리 · 강의 중계 주소)은 이 파일 하나가 정한다.
# .env 에는 이 파일이 ${이름} 으로 읽는 값(학생 키 LLM_API_KEY · 시작 파일이 적는 이 PC 값)과 COMPOSE_* 만 둔다 —
#   시작 파일(scripts/start_all.sh)이 그 밖의 옛 줄을 # 로 끄고 알린다. ${이름:?…} 값은 시작 파일이 정하므로 시작 파일을 먼저 실행한다.
# 선택 도구만 프로필: monitor(Prometheus) · tools(Redpanda Console) — 쓰려면 .env 에 COMPOSE_PROFILES=monitor,tools.
# 개발 · 강사가 값을 바꿀 때는 이 파일을 고치지 않고 저장소 루트 compose.override.yaml(git 이 무시, compose 가 저절로 합친다)에 적는다.
name: hyd-iot-edu

x-class:                                 # 수업 구성 값 — 여러 서비스가 같은 값을 받아야 해서 여기 한 곳에 둔다
  time-scale: &time-scale "20"           # 배속: 벽시계 1초 = 설비 20초(plant-sim · detector · process — agent · dmn-mcp 는 process 에서 읽는다)
  daq-profile: &daq-profile lite         # 수집: lite = 예외 보고(데드밴드 · 하트비트), full = 전 태그 1 Hz + 100 Hz 파형. 감지기와 근거 조회가 같은 계약을 쓴다
  tsdb-read-dsn: &tsdb-read-dsn postgresql://hyd_timeseries_reader:hyd-timeseries-read-local@timescaledb:5432/hyd   # 시계열 DB 읽기 전용 계정

x-logging: &log                          # 컨테이너 로그가 디스크(WSL vhdx)를 키우지 않게 순환
  driver: json-file
  options: { max-size: "5m", max-file: "2" }

x-py-health: &py-health
  interval: 5s
  timeout: 3s
  retries: 30
  start_period: 10s

networks:
  ot-net: {}
  it-net: {}
  sim-net: {}                              # 실습 시뮬레이터 API(:8000) 전용: process(정비 수행 모사) · portal(같은 출처 /svc/plant-sim/) ↔ plant-sim 만. OT 통로(emqx)는 DMZ 만 넘는다. 이 망은 실습장 조작(결함 주입 · 초기화 · 현장 패널 흉내 · 정비 수행 모사)용이고 승인된 원격 명령의 길이 아니다

volumes:
  tsdb-data: {}
  neo4j-data: {}
  redpanda-data: {}
  process-data: {}
  detector-data: {}
  worker-data: {}                          # agent-worker: 인스턴스별 작업공간 · Claude Code 세션 (재시작 뒤 resume)
  worker-runtime: {}                       # process가 생성하는 실행 인증; worker에는 읽기 전용
  effects-data: {}                         # effects-mcp: 쓰기 도구 멱등 키 기록

services:
  # ───────────────────────────── OT (ot-net) ─────────────────────────────
  emqx:                                   # L2 IoT 미들웨어 · MQTT 브로커
    restart: unless-stopped
    logging: *log
    mem_limit: 320m
    image: emqx/emqx:5.8
    networks: [ot-net]
    # 입구 · 계정 · 토픽 규칙은 ot/emqx 한 곳(emqx.conf 머리말). 호스트 1883 · 8083(웹소켓 — 3회차 대시보드 구독) = 바깥 입구(컨테이너 1884 · 8083,
    # 계정 student — 구독만). 서비스가 쓰는 안쪽 입구(컨테이너 1883)는 호스트에 열지 않는다 — 설비 명령은 cmd-gateway 만 보낸다
    ports: ["127.0.0.1:${HYD_PORT_1883:-1883}:1884", "127.0.0.1:${HYD_PORT_18083:-18083}:18083", "127.0.0.1:${HYD_PORT_8083:-8083}:8083"]
    volumes: ["./ot/emqx:/opt/emqx/etc/hyd:ro", "./ot/emqx/emqx.conf:/opt/emqx/etc/emqx.conf:ro"]
    environment:
      EMQX_DASHBOARD__DEFAULT_PASSWORD: public123   # 8자 이상 필수. 첫 로그인 때 변경을 요구하면 새 값으로 바꾸고 기억해 둘 것(로컬 대시보드 공개 초기값 · 키검사: 허용)
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  plant-sim:                              # L1 유압설비 3기 + soft-PLC + DAQ (EdgeX 역할 포함)
    restart: unless-stopped
    logging: *log
    mem_limit: 96m
    build: { context: ., dockerfile: ot/plant-sim/Dockerfile }
    networks: [ot-net, sim-net]           # sim-net: process 의 정비 수행 모사가 시뮬레이터 API(:8000)만 부른다(OT MQTT 에는 닿지 않음)
    ports: ["127.0.0.1:${HYD_PORT_8000:-8000}:8000"]
    environment:
      MQTT_HOST: emqx
      TIME_SCALE: *time-scale
      DAQ_PROFILE: *daq-profile
    depends_on:
      emqx: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      <<: *py-health

  fuxa:                                   # L6(OT) 웹 SCADA
    restart: unless-stopped
    logging: *log
    mem_limit: 192m
    image: frangoteam/fuxa:1.3.5          # 프로젝트(ot/fuxa/project.json)를 올려 확인한 판 — 판을 올리면 fuxa-init 업로드를 다시 확인한다
    networks: [ot-net]
    ports: ["127.0.0.1:${HYD_PORT_1881:-1881}:1881"]
    depends_on:
      emqx: { condition: service_healthy }
    healthcheck:                          # 이미지에 curl 이 없어 node 로 화면 응답을 본다
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:1881/api/settings', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      <<: *py-health

  fuxa-init:                              # FUXA 프로젝트(태그·뷰·알람) 자동 주입
    logging: *log
    mem_limit: 64m
    image: python:3.12-slim
    networks: [ot-net]
    volumes: ["./ot/fuxa:/work:ro"]
    command: ["python", "/work/init.py"]
    depends_on:
      fuxa: { condition: service_healthy }
    restart: "no"


  # ───────────────────────────── DMZ (ot-net + it-net) ─────────────────────────────
  connect-ingest:                         # L3 DMZ: OT MQTT → Kafka 단방향 복제
    restart: unless-stopped
    logging: *log
    mem_limit: 128m
    build: { context: ., dockerfile: dmz/connect-ingest/Dockerfile }
    networks: [ot-net, it-net]
    ports: ["127.0.0.1:${HYD_PORT_8093:-8093}:8093"]
    environment:
      MQTT_HOST: emqx
      KAFKA_BOOTSTRAP: redpanda:9092
    depends_on:
      redpanda: { condition: service_healthy }
      topic-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8093/healthz')"]
      <<: *py-health

  cmd-gateway:                            # L3 DMZ: Kafka action.cmd/alerts → OT. gw/validate.py 의 검증(승인 장부 · 만료 · 중복 등)을 모두 통과한 명령만 내려보낸다
    restart: unless-stopped
    logging: *log
    mem_limit: 128m
    build: { context: ., dockerfile: dmz/cmd-gateway/Dockerfile }
    networks: [ot-net, it-net]
    ports: ["127.0.0.1:${HYD_PORT_8090:-8090}:8090"]
    environment:
      MQTT_HOST: emqx
      KAFKA_BOOTSTRAP: redpanda:9092
      CMD_FINGERPRINT_KEY: ${CMD_FINGERPRINT_KEY:?시작 파일이 정합니다}   # 승인 장부 지문(HMAC) — process 와 같은 값(hydcommon/schemas.py)
    depends_on:
      redpanda: { condition: service_healthy }
      topic-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8090/healthz')"]
      <<: *py-health

  # ───────────────────────────── IT (it-net) ─────────────────────────────
  redpanda:                               # L3 이벤트 백본 (Kafka API 호환)
    restart: unless-stopped
    logging: *log
    mem_limit: 448m
    image: redpandadata/redpanda:v24.2.7
    networks: [it-net]
    command:
      - redpanda start
      - --mode dev-container
      - --smp 1
      - --memory 320M
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:${HYD_PORT_19092:-19092}
    ports: ["127.0.0.1:${HYD_PORT_19092:-19092}:19092", "127.0.0.1:${HYD_PORT_9644:-9644}:9644"]
    volumes: ["redpanda-data:/var/lib/redpanda/data"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  topic-init:                             # Kafka 토픽 7개 생성 (v3 5.2절)
    logging: *log
    mem_limit: 128m
    image: redpandadata/redpanda:v24.2.7
    networks: [it-net]
    entrypoint: ["/bin/bash", "/topics.sh"]
    volumes: ["./it/redpanda/topics.sh:/topics.sh:ro"]
    depends_on:
      redpanda: { condition: service_healthy }
    restart: "no"

  redpanda-console:                       # L3 진입점: 토픽·메시지 브라우저 (선택: tools 프로필)
    restart: unless-stopped
    logging: *log
    mem_limit: 128m
    image: redpandadata/console:v2.7.2
    profiles: [tools]
    networks: [it-net]
    ports: ["127.0.0.1:${HYD_PORT_8085:-8085}:8080"]
    environment:
      KAFKA_BROKERS: redpanda:9092
    depends_on:
      redpanda: { condition: service_healthy }

  timescaledb:                            # L5 시계열 저장소
    restart: unless-stopped
    logging: *log
    mem_limit: 256m
    image: timescale/timescaledb:2.17.2-pg16
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "work_mem=4MB", "-c", "max_connections=40",
              "-c", "timescaledb.max_background_workers=4", "-c", "max_worker_processes=10", "-c", "timescaledb.telemetry_level=off"]
    networks: [it-net]
    ports: ["127.0.0.1:${HYD_PORT_5432:-5432}:5432"]
    environment:
      POSTGRES_USER: hyd
      POSTGRES_PASSWORD: hyd
      POSTGRES_DB: hyd
    volumes:
      - tsdb-data:/var/lib/postgresql/data
      - ./it/timescaledb/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./it/timescaledb/reader.sql:/docker-entrypoint-initdb.d/reader.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hyd -d hyd"]
      interval: 5s
      timeout: 5s
      retries: 30

  connect-sink:                           # L5 Kafka → TimescaleDB 적재 (JDBC Sink 역할)
    restart: unless-stopped
    logging: *log
    mem_limit: 128m
    build: { context: ., dockerfile: it/connect-sink/Dockerfile }
    networks: [it-net]
    ports: ["127.0.0.1:${HYD_PORT_8094:-8094}:8094"]
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
      PG_DSN: postgresql://hyd:hyd@timescaledb:5432/hyd
    depends_on:
      redpanda: { condition: service_healthy }
      timescaledb: { condition: service_healthy }
      topic-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8094/healthz')"]
      <<: *py-health

  grafana:                                # L6(IT) 설비 추세 · 조치 주석
    restart: unless-stopped
    logging: *log
    mem_limit: 192m
    image: grafana/grafana:11.3.0
    networks: [it-net]
    ports: ["127.0.0.1:${HYD_PORT_3000:-3000}:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: light
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/hyd-trend.json
    volumes:
      - ./it/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      timescaledb: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      <<: *py-health

  detector:                               # L4 스트림 처리 · CEP (Flink 역할)
    restart: unless-stopped
    logging: *log
    mem_limit: 256m
    build: { context: ., dockerfile: it/detector/Dockerfile }
    networks: [it-net]
    ports: ["127.0.0.1:${HYD_PORT_8092:-8092}:8092"]
    volumes: ["detector-data:/data"]
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
      TIME_SCALE: *time-scale            # 저장 상태(/data)의 배속 · 수집 방식이 다르면 감지기가 켜지지 않는다 — 배속을 바꿀 때는 RUNBOOK 대로
      DAQ_PROFILE: *daq-profile
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_AUTH: neo4j/hydpass123
    depends_on:
      redpanda: { condition: service_healthy }
      topic-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8092/healthz')"]
      <<: *py-health

  prometheus:                             # L6 플랫폼 감시 (선택)
    restart: unless-stopped
    logging: *log
    mem_limit: 128m
    image: prom/prometheus:v2.55.1
    profiles: [monitor]
    networks: [it-net]
    ports: ["127.0.0.1:${HYD_PORT_9090:-9090}:9090"]
    volumes:
      - ./it/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./it/prometheus/rules.yml:/etc/prometheus/rules.yml:ro

  neo4j:                                  # L7 온톨로지 지식 그래프
    restart: unless-stopped
    logging: *log
    mem_limit: 1536m                      # APOC 스키마 조회 + 온톨로지 질의 계획
    image: neo4j:5.26-community
    networks: [it-net]
    ports: ["127.0.0.1:${HYD_PORT_7474:-7474}:7474", "127.0.0.1:${HYD_PORT_7687:-7687}:7687"]
    environment:
      NEO4J_AUTH: neo4j/hydpass123
      NEO4J_server_bolt_advertised__address: "localhost:${HYD_PORT_7687:-7687}"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.meta.*
      NEO4J_server_memory_heap_initial__size: 128m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 48m
      NEO4J_server_jvm_additional: "-XX:MaxMetaspaceSize=384m"
      NEO4J_server_memory_query__cache_per__db__cache__num__entries: "100"   # 질의 계획 캐시를 줄여(기본 1000) 메타스페이스를 아낀다
      NEO4J_db_tx__log_rotation_retention__policy: "1 files"
      NEO4J_dbms_usage__report_enabled: "false"   # 학생 PC가 Neo4j 회사로 사용 통계를 보내지 않게(dbms.usage_report.enabled)
    volumes: ["neo4j-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/7687' || exit 1"]   # Bolt 포트만 연결해 본다 — 메모리 한도 안에서 JVM(cypher-shell)을 하나 더 띄우지 않는다
      interval: 5s
      timeout: 10s
      retries: 40
      start_period: 20s

  kg-seed:                                # 온톨로지 스키마·인스턴스 적재 (멱등)
    logging: *log
    mem_limit: 384m
    image: neo4j:5.26-community
    networks: [it-net]
    entrypoint: ["/bin/bash", "/seed/seed.sh"]
    volumes: ["./it/neo4j:/seed:ro"]
    depends_on:
      neo4j: { condition: service_healthy }
    restart: "no"

  agent:                                  # L8 AI 에이전트 (한 프로세스 안의 읽기 전용 도구 모듈 mcp_kg·mcp_tsdb·mcp_prom·mcp_ent — MCP 서버 아님; 실제 MCP 서버는 dmn-mcp·enterprise-mcp)
    restart: unless-stopped
    logging: *log
    mem_limit: 192m
    build: { context: ., dockerfile: it/agent/Dockerfile }
    networks: [it-net]
    ports: ["127.0.0.1:${HYD_PORT_8091:-8091}:8091"]
    environment:
      TSDB_READ_DSN: *tsdb-read-dsn
      DAQ_PROFILE: *daq-profile          # 근거 구간의 공백 한도 = 감지기와 같은 수집 계약
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_AUTH: neo4j/hydpass123
      PROCESS_URL: http://process:8080
      ENTERPRISE_URL: http://enterprise-sim:8095
      ENTERPRISE_READ_DSN: ${ENTERPRISE_READ_DSN:-postgresql://hyd_enterprise_reader:hyd-enterprise-read-local@host.docker.internal:54322/postgres}
    extra_hosts: ["host.docker.internal:host-gateway"]   # 업무 DB(호스트의 Supabase) 이름 — Docker Desktop 은 스스로 풀고, Linux 엔진은 이 줄이 있어야 푼다
    depends_on:
      kg-seed: { condition: service_completed_successfully }
      connect-sink: { condition: service_healthy }
      process: { condition: service_healthy }
      enterprise-sim: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8091/healthz')"]
      <<: *py-health

  process:                                # L9 프로세스 엔진 (미니 BPMN: 승인 → action.cmd → ACK → 재관측 → 종결)
    restart: unless-stopped
    logging: *log
    mem_limit: 768m                       # PG 원천 · 승인 · 투영 큐와 사건 스냅숏을 함께 든다(512m 에서 509 MiB 실측)
    build: { context: ., dockerfile: it/process/Dockerfile }
    networks: [it-net, sim-net]           # sim-net: 정비 수행 모사가 plant-sim 을 서비스 이름(plant-sim:8000)으로 부른다 (Linux 에서 호스트 루프백 불가).
                                          # ot-net 에는 붙이지 않는다 — IT 서비스가 OT(emqx)에 직접 닿으면 DMZ(cmd-gateway)가 유일한 하향 통로가 아니게 된다
    ports: ["127.0.0.1:${HYD_PORT_8080:-8080}:8080"]
    volumes: ["process-data:/data", "worker-runtime:/run/hyd-credentials"]
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
      PG_DSN: postgresql://hyd:hyd@timescaledb:5432/hyd
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_AUTH: neo4j/hydpass123
      TIME_SCALE: *time-scale
      #   대기 압축: 시간 대기 · 입고 확인 · 정비 수행과 그 경계 타이머만 배속 × 이 배율(20배속 × 360 = 7200배 — 업무 시간 하루가 12초,
      #   납기 5일이 1분). 학생이 「발주 중」을 보고 [공급사 납기 지연]을 눌러 볼 만큼만 기다리게 한 값이다(전에는 60 — 납기 5일이 6분).
      #   설비 · 감지기 · 재관측은 배속만, 사람이 읽고 고르는 시간(승인 시한 · 카드 신선도 · 승인 지연 알림)은 벽시계다
      PROCESS_WAIT_COMPRESSION: "360"
      ENTERPRISE_URL: http://enterprise-sim:8095
      # 경보가 프로세스 인스턴스(처리 건)를 열고 에이전트 · 사람은 그 안의 작업 — 업무 DB(Supabase)가 원천이다.
      SUPABASE_DSN: ${SUPABASE_DSN:-postgresql://postgres:postgres@host.docker.internal:54322/postgres}
      # 데이터 패브릭(/api/fabric/*): 쓰기 연결이 아니라 두 전용 읽기 계정만 쓴다
      ENTERPRISE_READ_DSN: ${ENTERPRISE_READ_DSN:-postgresql://hyd_enterprise_reader:hyd-enterprise-read-local@host.docker.internal:54322/postgres}
      TSDB_READ_DSN: *tsdb-read-dsn
      HYD_WORKER_RUNTIME_KEY_FILE: /run/hyd-credentials/runtime.key
      # 강의 중계(LiteLLM, Anthropic 방식 주소 — 끝에 /v1 없음). 키는 process 만 받고 워커 CLI 에는 작업에 묶인 토큰만 간다(course_model.py)
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_RELAY_URL: https://knu-litellm-1087825885001.asia-northeast3.run.app
      # 업무 시스템 쓰기 · 승인 뒤 메일 도구를 process 만 부르게 하는 값(enterprise-sim · effects-mcp 와 같은 값), 승인 장부 지문 키(cmd-gateway 와 같은 값)
      PROCESS_CALLER_TOKEN: ${PROCESS_CALLER_TOKEN:?시작 파일이 정합니다}
      CMD_FINGERPRINT_KEY: ${CMD_FINGERPRINT_KEY:?시작 파일이 정합니다}
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      redpanda: { condition: service_healthy }
      topic-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8080/healthz')"]
      <<: *py-health

  enterprise-sim:                         # L9 연계 대상: 기업 시스템 목업 (ERP · MES · CMMS · QMS · SCM · EMS)
    restart: unless-stopped
    logging: *log
    mem_limit: 96m
    build: { context: ., dockerfile: it/enterprise-sim/Dockerfile }
    networks: [it-net]
    ports: ["127.0.0.1:${HYD_PORT_8095:-8095}:8095"]
    environment:
      # 업무 DB(Supabase ent 스키마)가 원천이다
      SUPABASE_DSN: ${SUPABASE_DSN:-postgresql://postgres:postgres@host.docker.internal:54322/postgres}
      PROCESS_CALLER_TOKEN: ${PROCESS_CALLER_TOKEN:?시작 파일이 정합니다}   # 쓰기 · 초기화 끝점은 process 만(머리글 X-HYD-Process-Caller)
    extra_hosts: ["host.docker.internal:host-gateway"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8095/healthz')"]
      <<: *py-health

  effects-mcp:                            # 사람 승인 뒤 시스템 task 가 부르는 쓰기 도구 서버(메일 보내기 send_mail). 에이전트에는 붙이지 않는다
    restart: unless-stopped
    logging: *log
    mem_limit: 128m
    build: { context: ., dockerfile: it/effects-mcp/Dockerfile }
    networks: [it-net]
    ports: ["127.0.0.1:${HYD_PORT_8197:-8197}:8197"]
    environment:
      SMTP_PORT: ${EFFECTS_SMTP_PORT:-54325}   # 메일은 이 PC의 업무 DB 메일함(Supabase Inbucket, config.toml [inbucket] smtp_port)으로만 — 주소는 host.docker.internal(코드 기본값)
      EFFECTS_STATE_PATH: /data/effects.sqlite3
      PROCESS_CALLER_TOKEN: ${PROCESS_CALLER_TOKEN:?시작 파일이 정합니다}   # 쓰기 도구는 process 만
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["effects-data:/data"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8197/healthz')"]
      <<: *py-health

  portal:                                 # L9 운전원 가이드 앱 · 설비 포탈 (정적 SPA + 서비스로 가는 같은 출처 길 /svc/…)
    restart: unless-stopped
    logging: *log
    mem_limit: 32m
    # 다른 서비스처럼 시작(up --build)이 같은 판의 화면을 이미지로 굽는다 — 실행 중에 받은 새 판 · 손댄 파일이 옛 판 서비스 앞에 바로 보이지 않는다.
    # nginx 이미지가 templates 의 ${HYD_PORTS} 를 채워 conf.d 에 쓴다. 화면을 고치며 바로 보려면 compose.override.yaml 에서 두 자리를 bind mount 한다(RUNBOOK)
    build:
      context: ./it/portal
      dockerfile_inline: |
        FROM nginx:1.27-alpine
        COPY www /usr/share/nginx/html
        COPY nginx.conf /etc/nginx/templates/default.conf.template
    networks: [it-net, sim-net]           # sim-net: 같은 출처 길 /svc/plant-sim/ 이 시뮬레이터 API(:8000)에만 닿는다(OT MQTT 망에는 붙지 않음)
    ports: ["127.0.0.1:${HYD_PORT_8088:-8088}:80"]
    environment:
      HYD_PORTS: ${HYD_PORTS:-}                  # 겹쳐서 옮긴 바깥 포트 표 "원래=새것 …"(시작이 .env에 씀). 새 탭으로 여는 도구 화면 주소에 쓴다
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      <<: *py-health

  # ───────────────────────────── AI 워커 · 에이전트용 MCP ─────────────────────────────
  # 키 있는 PC는 실제 AI(강의 중계 — process 관문 경유), 키 없는 PC는 강사가 저장한 응답 재생(AI_MODE, 시작 파일이 정한다).
  enterprise-mcp:                         # 업무 DB(Supabase ent 스키마)를 에이전트에게 읽기 전용 도구로 (WMS 예제의 wms-mcp 역할)
    restart: unless-stopped
    logging: *log
    mem_limit: 160m
    build: { context: ., dockerfile: it/enterprise-mcp/Dockerfile }
    networks: [it-net]
    ports: ["127.0.0.1:${HYD_PORT_8199:-8199}:8199"]
    environment:
      ENTERPRISE_DSN: ${ENTERPRISE_READ_DSN:-postgresql://hyd_enterprise_reader:hyd-enterprise-read-local@host.docker.internal:54322/postgres}
    extra_hosts: ["host.docker.internal:host-gateway"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8199/healthz')"]
      <<: *py-health

  enterprise-mcp-maint:                   # 업무 도구 서버 보전용(정비 계획 · 운전시간 계수기 · 작업지시 · 생산 오더) — 같은 코드, 도구 묶음만 다름
    restart: unless-stopped
    logging: *log
    mem_limit: 160m
    build: { context: ., dockerfile: it/enterprise-mcp/Dockerfile }
    networks: [it-net]
    ports: ["127.0.0.1:${HYD_PORT_8196:-8196}:8196"]
    environment:
      ENTERPRISE_DSN: ${ENTERPRISE_READ_DSN:-postgresql://hyd_enterprise_reader:hyd-enterprise-read-local@host.docker.internal:54322/postgres}
      ENTERPRISE_MCP_TOOLSET: maintenance
      MCP_PORT: "8196"
    extra_hosts: ["host.docker.internal:host-gateway"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8196/healthz')"]
      <<: *py-health

  enterprise-mcp-purchase:                # 업무 도구 서버 구매용(ERP 예비품 재고 · SCM 공급사 견적)
    restart: unless-stopped
    logging: *log
    mem_limit: 160m
    build: { context: ., dockerfile: it/enterprise-mcp/Dockerfile }
    networks: [it-net]
    ports: ["127.0.0.1:${HYD_PORT_8195:-8195}:8195"]
    environment:
      ENTERPRISE_DSN: ${ENTERPRISE_READ_DSN:-postgresql://hyd_enterprise_reader:hyd-enterprise-read-local@host.docker.internal:54322/postgres}
      ENTERPRISE_MCP_TOOLSET: purchasing
      MCP_PORT: "8195"
    extra_hosts: ["host.docker.internal:host-gateway"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8195/healthz')"]
      <<: *py-health

  dmn-mcp:                                # 결정론 판단 엔진(agentsvc cards · decide)을 MCP 도구로 — 반복 판단은 DMN, LLM 은 수집·설명
    restart: unless-stopped
    logging: *log
    mem_limit: 192m
    build: { context: ., dockerfile: it/dmn-mcp/Dockerfile }
    networks: [it-net]
    ports: ["127.0.0.1:${HYD_PORT_8198:-8198}:8198"]
    environment:
      TSDB_READ_DSN: *tsdb-read-dsn
      DAQ_PROFILE: *daq-profile          # 근거 구간의 공백 한도 = 감지기와 같은 수집 계약
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_AUTH: neo4j/hydpass123
      PROCESS_URL: http://process:8080
      ENTERPRISE_URL: http://enterprise-sim:8095
      INGEST_URL: http://connect-ingest:8093/healthz
      ENTERPRISE_READ_DSN: ${ENTERPRISE_READ_DSN:-postgresql://hyd_enterprise_reader:hyd-enterprise-read-local@host.docker.internal:54322/postgres}
    extra_hosts: ["host.docker.internal:host-gateway"]   # agent 와 같은 까닭: 입력 데이터 원천 읽기가 호스트의 업무 DB 로 간다
    depends_on:
      kg-seed: { condition: service_completed_successfully }
      process: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8198/healthz')"]
      <<: *py-health

  agent-worker:                           # L8 에이전트 워커: todolist(agent_orch=cliagents) 를 집어 Claude Code 로 수행 (process-gpt-cli-agent 역할)
    restart: unless-stopped
    logging: *log
    mem_limit: 768m
    build: { context: ., dockerfile: it/agent-worker/Dockerfile }
    networks: [it-net]
    ports: ["127.0.0.1:${HYD_PORT_8097:-8097}:8097"]
    # 저장된 AI 응답(재생모드.md): 강사 저장(AI_MODE=record)은 저장소 폴더에 쓰고, 키 없는 PC 재생은 git pull 로 받은 그 폴더를 읽는다
    volumes: ["worker-data:/workspace", "worker-runtime:/run/hyd-credentials:ro", "./it/agent-worker/replay:/srv/replay"]
    environment:
      # 시작 스크립트가 .env 에 정한다: 키 있으면 live, 없으면 replay(강사가 저장한 응답), 저장은 start_all.sh --record
      AI_MODE: ${AI_MODE:?시작 파일이 정합니다}
      AI_REPLAY_DIR: /srv/replay
      # 워커는 ProcessGPT 에이전트 종류 `cliagents`(process-gpt-cli-agent): todolist 를 fetch_pending_task 로 집고,
      # 테넌트의 도구 서버를 tenants.mcp(seed.sql)에서 읽고, 결과를 save_task_result 로 남긴다.
      SUPABASE_DSN: ${SUPABASE_DSN:-postgresql://postgres:postgres@host.docker.internal:54322/postgres}
      TENANT_ID: hyd
      CONSUMER_ID: agent-worker:docker
      # 원본 중계 키는 process만 읽는다. 수업 판정 · 모델 관문 · 실행 토큰은 모두 process 한 주소(worker/course_access.py),
      # CLI 의 모델 주소 · 모델 이름은 관문이 실행마다 준다. 실행기 인증 파일은 process 가 만든 것을 읽기 전용으로 본다(같은 볼륨 · 같은 경로)
      PROCESS_URL: http://process:8080
      HYD_WORKER_RUNTIME_KEY_FILE: /run/hyd-credentials/runtime.key
      DISABLE_TELEMETRY: "1"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
      CLIAGENTS_WORKSPACE_ROOT: /workspace   # 권한 · 실행 시한 · 허용 도구 목록은 worker/settings.py 한 곳
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      process: { condition: service_healthy }
      enterprise-mcp: { condition: service_healthy }
      enterprise-mcp-maint: { condition: service_healthy }
      enterprise-mcp-purchase: { condition: service_healthy }
      dmn-mcp: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8097/healthz')"]
      <<: *py-health
