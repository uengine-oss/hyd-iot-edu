# Public listener: approved classroom operations only. TLS terminates at the
# instructor's ingress; this port is bound to loopback by the compose override.
server {
  listen 8080;
  server_tokens off;
  access_log off;
  client_max_body_size 16k;
  proxy_read_timeout 35s;
  add_header Cache-Control "no-store" always;
  location = /healthz { proxy_pass http://process:8080/classroom/healthz; }
  location = /v1/classroom/tool-results {
    client_max_body_size 192000;
    proxy_pass http://process:8080/classroom/v1/classroom/tool-results;
    proxy_set_header Authorization $http_authorization;
  }
  location /v1/classroom/ {
    proxy_pass http://process:8080/classroom/v1/classroom/;
    proxy_set_header Authorization $http_authorization;
  }
  location / { return 404; }
}

# Not published on the host. Only the instructor's managed worker uses this
# listener, and application-layer claim/lease credentials are still mandatory.
server {
  listen 8081;
  server_tokens off;
  access_log off;
  client_max_body_size 2m;
  proxy_read_timeout 1800s;
  proxy_buffering off;
  add_header Cache-Control "no-store" always;
  location = /internal/worker/model-runtime {
    proxy_pass http://process:8080/classroom/internal/worker/model-runtime;
  }
  location = /internal/worker/tool-request {
    client_max_body_size 16k;
    proxy_pass http://process:8080/classroom/internal/worker/tool-request;
  }
  location = /internal/worker/tool-result {
    client_max_body_size 16k;
    proxy_pass http://process:8080/classroom/internal/worker/tool-result;
  }
  location = /internal/worker/tool-catalog {
    client_max_body_size 1k;
    proxy_pass http://process:8080/classroom/internal/worker/tool-catalog;
  }
  location = /internal/model/v1/messages {
    proxy_pass http://process:8080/classroom/internal/model/v1/messages;
  }
  location = /internal/model/v1/messages/count_tokens {
    proxy_pass http://process:8080/classroom/internal/model/v1/messages/count_tokens;
  }
  location / { return 404; }
}
