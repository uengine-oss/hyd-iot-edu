# Supabase 로컬 프로젝트 (supabase CLI: `cd it/supabase && supabase start`)
# 업무 DB(ent 스키마: ERP · MES · CMMS · QMS · SCM · EMS)와 프로세스 엔진 테이블(proc_def · bpm_proc_inst · todolist · events)을 둔다.
# 포트는 Supabase 기본값(54321~). 기존 스택(TimescaleDB 5432 · process 8080 · portal 8088)과 겹치지 않는다.
# 다른 프로젝트의 supabase 와 함께 띄우려면 아래 포트만 바꾼다.
project_id = "hyd-iot-edu"

[api]
enabled = true
port = 54321
schemas = ["public", "ent", "storage", "graphql_public"]
extra_search_path = ["public", "ent", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = false
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = false
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:8088"
additional_redirect_urls = ["http://localhost:8088"]
jwt_expiry = 10800
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 30
enable_signup = true
enable_manual_linking = false

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false

[auth.sms]
enable_signup = false
enable_confirmations = false

[analytics]
enabled = false
port = 54327
vector_port = 54328
backend = "postgres"
