server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  # Assets have stable filenames: validate them on each load after local updates.
  add_header Cache-Control "no-cache" always;
  # 이 PC에서 다른 프로그램과 겹쳐 옮긴 바깥 포트 표(start_all.sh → .env HYD_PORTS → 이 템플릿). 포털의 P()가 읽는다
  sub_filter '</head>' '<script>window.HYD_PORTS_RAW="${HYD_PORTS}";</script></head>';
  sub_filter_once on;
  # process 주소는 요청 때마다 Docker 내부 DNS 로 다시 찾는다 — 시작 때 한 번 찾은 IP 를 쥐고 있으면 process 컨테이너가 다시 뜬 뒤(새 IP)
  # 아래 프록시가 502(연결 거부)로 굳는다(2026-10-30 화면 순회에서 실측). 변수로 적은 proxy_pass 만 이 resolver 를 쓴다.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $process_upstream http://process:8080;
  # OAuth uses one browser origin, including the HttpOnly callback binding.
  # Authorization codes and states must never enter nginx access logs.
  location = /api/mcp/connections/callback {
    access_log off;
    proxy_pass $process_upstream;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location /api/mcp/connections {
    proxy_pass $process_upstream;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location / { try_files $uri $uri/ /index.html; }
}
