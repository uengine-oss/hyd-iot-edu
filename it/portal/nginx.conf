# 포털 nginx — 화면 파일을 내주고, 화면이 부르는 서비스를 같은 출처 길 /svc/<서비스>/… 로 넘긴다.
# 브라우저는 서비스 포트(다른 출처)를 부르지 않는다 — 서비스는 다른 출처 요청을 받지 않으므로(CORS 없음) 학생이 연 다른 웹 페이지가
# 이 PC의 서비스에 쓰기 요청을 보낼 수 없다. 화면 쪽 주소표는 it/portal/www/layers.js 의 API 하나다.
# (compose.yaml 이 이 파일을 nginx 이미지의 템플릿 자리에 싣는다 — ${HYD_PORTS} 만 환경 값으로 채워지고 나머지 $이름 은 nginx 변수다.)

# 서비스 이름 → 내부 주소(compose 서비스 이름:포트). 여기에 없는 이름은 404 — 화면이 부르는 서비스만 둔다.
map $request_uri $svc_upstream {
  ~^/svc/process/          process:8080;
  ~^/svc/agent/            agent:8091;
  ~^/svc/agent-worker/     agent-worker:8097;
  ~^/svc/enterprise-sim/   enterprise-sim:8095;
  ~^/svc/plant-sim/        plant-sim:8000;
  ~^/svc/detector/         detector:8092;
  ~^/svc/cmd-gateway/      cmd-gateway:8090;
  ~^/svc/connect-ingest/   connect-ingest:8093;
  ~^/svc/connect-sink/     connect-sink:8094;
  default                  "";
}
# /svc/<서비스> 를 뗀 나머지 — 브라우저가 보낸 원래 글자 그대로(쿼리 포함, %인코딩을 풀지 않는다: id 속 %2F 등이 경로로 바뀌지 않게)
map $request_uri $svc_path {
  ~^/svc/[a-z-]+(?<svc_rest>/.*)$  $svc_rest;
  default                          /;
}
map $request_uri $svc_name {
  ~^/svc/(?<svc_label>[a-z-]+)/    $svc_label;
  default                          "알 수 없음";
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  # Assets have stable filenames: validate them on each load after local updates.
  add_header Cache-Control "no-cache" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;
  add_header Content-Security-Policy "frame-ancestors 'self'" always;
  # 이 PC에서 다른 프로그램과 겹쳐 옮긴 바깥 포트 표(start_all.sh → .env HYD_PORTS → 이 템플릿). 포털의 P()가 새 탭으로 여는 도구 주소에 쓴다
  sub_filter '</head>' '<script>window.HYD_PORTS_RAW="${HYD_PORTS}";</script></head>';
  sub_filter_once on;
  # 서비스 주소는 요청 때마다 Docker 내부 DNS 로 다시 찾는다 — 시작 때 한 번 찾은 IP 를 쥐고 있으면 서비스 컨테이너가 다시 뜬 뒤(새 IP)
  # 프록시가 502(연결 거부)로 굳는다(2026-10-30 화면 순회에서 실측). 변수로 적은 proxy_pass 만 이 resolver 를 쓴다.
  resolver 127.0.0.11 valid=10s ipv6=off;
  # 브라우저가 부른 주인(포털 주소:포트)을 서비스에 넘긴다 — 서비스는 Sec-Fetch-Site 가 없는 옛 브라우저의 쓰기를 Origin 과 이 값으로 같은
  # 출처인지 가린다(hydcommon.service.foreign_write). proxy_set_header 를 따로 적은 location 은 이 줄을 물려받지 않아 거기에도 적는다.
  proxy_set_header X-Forwarded-Host $http_host;

  # 화면 파일: 해시 주소(#/…)만 쓰므로 없는 파일은 404(index.html 로 대신하지 않는다)
  location / { try_files $uri $uri/ =404; }

  # ── 서비스 길 ──
  # 크기 한도: 보통 요청은 4 MB(가장 큰 글은 흐름 그림 · 매핑 · DDL — procsvc/course_policy.TEXT_MAX 20만 자, UTF-8 로 최대 약 0.6 MB + JSON), 문서 올리기 · 설정 불러오기만 아래에서 따로.
  # 시간 한도: 답을 300초 기다린다(설정 불러오기 · 되돌리기 180초가 가장 길다 — configBundle.js), 판단 채점 실행 · 실시간 알림만 아래에서 따로.
  location /svc/ {
    default_type "application/json; charset=utf-8";      # 아래 404 처럼 nginx 가 직접 답할 때만 쓰인다(서비스 응답은 서비스의 형식 그대로)
    if ($svc_upstream = "") { return 404 '{"detail":"포털에 없는 서비스 길입니다 ($svc_name)"}'; }
    client_max_body_size 4m;
    proxy_read_timeout 300s;
    proxy_pass http://$svc_upstream$svc_path;
  }
  # 수업 문서 올리기: 파일 30 MiB(procsvc/manual_sources.MAX_BYTES)를 base64 로 싣는다 → 40 MiB + JSON 머리
  location = /svc/process/api/kg/manuals/preview {
    client_max_body_size 41m;
    proxy_read_timeout 300s;
    proxy_pass http://$svc_upstream$svc_path;
  }
  # 출발본(설정 묶음) 불러오기: 흐름 그림 · 스킬 본문을 함께 싣는다(2026-10-30 강사 스택 내보내기 69 KB — TEXT_MAX 글 여럿을 담을 여유)
  location = /svc/process/api/config/import {
    client_max_body_size 16m;
    proxy_read_timeout 300s;
    proxy_pass http://$svc_upstream$svc_path;
  }
  # 판단 채점 실행: 정답표 항목 × 반복(최대 10) 을 한 요청 안에서 돌린다(eval_api.create_run) — 화면은 기다림을 따로 보인다(evaluation.js)
  location = /svc/process/api/eval/runs {
    client_max_body_size 4m;
    proxy_read_timeout 3600s;
    proxy_pass http://$svc_upstream$svc_path;
  }
  # 실시간 알림(SSE): 버퍼링 없이 바로 넘기고, 15초마다 오는 keepalive(instance_mode.event_stream) 사이를 끊지 않는다
  location ~ ^/svc/process/api/(events/stream|inbox/notifications/stream)$ {
    proxy_buffering off;
    proxy_cache off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_read_timeout 1h;
    proxy_pass http://$svc_upstream$svc_path;
  }

  # 서비스가 꺼졌거나 늦을 때 — 화면(requestJ)이 읽는 JSON 한 줄로, 어느 서비스인지 밝힌다(nginx 기본 HTML 오류 쪽 대신)
  error_page 502 503 = @svc_down;
  error_page 504 = @svc_slow;
  error_page 413 = @too_large;
  location @svc_down {
    default_type "application/json; charset=utf-8";
    return 502 '{"detail":"서비스($svc_name)에 연결하지 못했습니다 — 꺼져 있거나 다시 켜지는 중입니다. 시스템 구성 화면에서 상태를 확인한 뒤 다시 시도하세요."}';
  }
  location @svc_slow {
    default_type "application/json; charset=utf-8";
    return 504 '{"detail":"서비스($svc_name)가 제한 시간 안에 답하지 않았습니다 — 처리가 끝났는지 화면을 새로 읽어 확인한 뒤 다시 시도하세요."}';
  }
  location @too_large {
    default_type "application/json; charset=utf-8";
    return 413 '{"detail":"보낸 내용이 이 기능의 크기 한도를 넘었습니다 — 더 작은 파일 · 내용으로 다시 시도하세요."}';
  }
}
