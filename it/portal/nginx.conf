server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  # Assets have stable filenames: validate them on each load after local updates.
  add_header Cache-Control "no-cache" always;
  # OAuth uses one browser origin, including the HttpOnly callback binding.
  # Authorization codes and states must never enter nginx access logs.
  location = /api/mcp/connections/callback {
    access_log off;
    proxy_pass http://process:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location /api/mcp/connections {
    proxy_pass http://process:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location / { try_files $uri $uri/ /index.html; }
}
