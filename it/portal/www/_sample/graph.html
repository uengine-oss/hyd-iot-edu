<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지식 지도 — 견본</title>
<link rel="stylesheet" href="../vendor/basecoat/basecoat.min.css">
<link rel="stylesheet" href="portal-kit.css">
<style>
  .kg { display: grid; grid-template-columns: minmax(0, 1fr) 348px; gap: 16px; height: calc(100vh - var(--top-h) - 150px); min-height: 540px; }
  .kg .canvas { height: 100%; }
  #cy { position: absolute; inset: 0; }
  .kg-side { border: 1px solid var(--border); border-radius: 12px; background: #fff; overflow: auto; display: flex; flex-direction: column; }
  .kg-side .empty { margin: auto; border: 0; }
  .node-head { padding: 18px 18px 14px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: #fff; z-index: 1; }
  .node-head h2 { font-size: 18px; line-height: 26px; font-weight: 650; margin-top: 8px; }
  .node-head p { font-size: 13px; color: var(--muted-foreground); margin-top: 2px; }
  .node-sec { padding: 14px 18px; border-bottom: 1px solid var(--border); }
  .node-sec:last-child { border-bottom: 0; }
  .node-sec h3 { font-size: 12.5px; font-weight: 600; color: var(--muted-foreground); margin-bottom: 8px; display: flex; gap: 6px; align-items: center; }
  .node-sec h3 .num { margin-left: auto; font-weight: 500; }
  .rel { margin-bottom: 10px; }
  .rel:last-child { margin-bottom: 0; }
  .rel-name { font-size: 12px; color: var(--muted-foreground); margin-bottom: 5px; display: flex; align-items: center; gap: 5px; }
  .rel-name .ic { width: 12px; height: 12px; }
  .gtag { --c: var(--ink-4); display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 550; color: var(--ink-2); }
  .gtag i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
  .chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--ink-4)); flex: none; }
  .chip { max-width: 100%; } .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kg-stat { font-size: 12.5px; color: var(--cv-ink-2); padding: 0 4px; }
  .kg-select { height: 30px; padding: 0 28px 0 10px; border-radius: 8px; background: var(--cv-tool) var(--chevron-down-icon) no-repeat right 8px center / 14px; border: 1px solid var(--cv-border); color: var(--cv-ink); font: inherit; font-size: 13px; appearance: none; max-width: 190px; }
  .kg-select option { color: #111; }
  .kg-hint { position: absolute; left: 50%; bottom: 46px; transform: translateX(-50%); z-index: 5; font-size: 12px; color: var(--cv-ink-3); pointer-events: none; white-space: nowrap; }
  @media (max-width: 1000px) { .kg { grid-template-columns: 1fr; height: auto; } .kg .canvas { height: 520px; } }
</style>
</head>
<body data-menu="knowledge" data-view="ontology">
<main>
  <div class="page" style="padding-bottom:24px">
    <div class="page-head">
      <div><h1>지식 지도</h1><p>AI가 판단할 때 읽는 온톨로지입니다. 항목을 누르면 무엇과 이어져 있는지 보입니다.</p></div>
      <div class="page-tools">
        <select class="select" id="asset" aria-label="설비"><option>HYD-01</option><option>HYD-02</option><option>HYD-03</option></select>
        <button type="button" class="btn" data-variant="outline" id="reload"></button>
      </div>
    </div>
    <div class="kg">
      <div class="canvas">
        <div class="canvas-bar">
          <label class="cv-search"><span id="searchIc"></span><input type="search" id="q" placeholder="이름으로 찾기" aria-label="항목 이름으로 찾기"></label>
          <select class="kg-select" id="path" aria-label="이상 패턴 경로"><option value="">이상 패턴 경로 · 전체</option></select>
          <span class="kg-stat num" id="stat" role="status"></span>
          <span class="grow"></span>
          <span class="cv-tools" id="tools"></span>
        </div>
        <div id="cy" role="application" aria-label="지식 지도. 끌어서 옮기고 휠로 확대합니다."></div>
        <div class="canvas-foot" id="groups" role="group" aria-label="묶음 켜고 끄기"></div>
      </div>
      <aside class="kg-side" id="side" aria-label="고른 항목" aria-live="polite"></aside>
    </div>
  </div>
</main>
<script src="../vendor/basecoat/basecoat.min.js" defer></script>
<script src="../vendor/cytoscape/cytoscape.min.js"></script>
<script src="../vendor/cytoscape-fcose/layout-base.js"></script>
<script src="../vendor/cytoscape-fcose/cose-base.js"></script>
<script src="../vendor/cytoscape-fcose/cytoscape-fcose.js"></script>
<script type="module">
import { mountShell, icon, esc } from './shell.js';
mountShell();
document.getElementById('reload').innerHTML = icon('refresh-cw') + '다시 읽기';
document.getElementById('searchIc').innerHTML = icon('search');
document.getElementById('tools').innerHTML = `<button type="button" id="zo" aria-label="축소">${icon('minus')}</button><button type="button" id="zi" aria-label="확대">${icon('plus')}</button><button type="button" id="fit" aria-label="화면에 맞춤">${icon('scan')}</button>`;

const GROUPS = [
  { key: 'value', title: '전략 목표', at: [0.13, 0.2], color: '#b794f6', labels: ['Perspective', 'Objective', 'Measure'] },
  { key: 'process', title: '프로세스', at: [0.4, 0.08], color: '#7aa2ff', labels: ['Process', 'Event', 'Task', 'Gateway'] },
  { key: 'resource', title: '자원', at: [0.14, 0.74], color: '#9aa7b5', labels: ['OrgUnit', 'Role', 'System', 'Asset', 'Component', 'Sensor', 'Actuator', 'StateVariable', 'Part', 'Supplier'] },
  { key: 'diagnosis', title: '설비 진단', at: [0.4, 0.5], color: '#f07167', labels: ['AnomalyPattern', 'Symptom', 'FailureMode', 'Cause', 'Evidence', 'ManualSection'] },
  { key: 'skill', title: '조치 방법과 규칙', at: [0.76, 0.46], color: '#2dd4bf', labels: ['Skill', 'Step', 'Action', 'Decision', 'DecisionTable', 'Rule', 'InputData', 'KnowledgeSource'] },
  { key: 'external', title: '외부 변수 · 예측 · 사례', at: [0.45, 0.93], color: '#f5a623', labels: ['ExternalVariable', 'Forecast', 'Incident', 'DecisionCase'] },
];
const LABEL_KO = { Perspective: '관점', Objective: '전략 목표', Measure: '성과 지표', Process: '프로세스', Event: '이벤트', Task: '단계', Gateway: '분기', OrgUnit: '부서', Role: '역할', System: '시스템', Asset: '설비',
  Component: '구성 요소', Sensor: '센서', Actuator: '구동기', StateVariable: '상태 변수', Part: '부품', Supplier: '공급사', AnomalyPattern: '이상 패턴', Symptom: '증상', FailureMode: '고장 유형', Cause: '원인', Evidence: '증거',
  ManualSection: '매뉴얼 절', Skill: '조치 방법', Step: '절차 단계', Action: '세부 동작', Decision: '판단', DecisionTable: '결정표', Rule: '규칙', InputData: '입력 데이터', KnowledgeSource: '지식 출처', ExternalVariable: '외부 변수', Forecast: '예측', Incident: '사건', DecisionCase: '판단 사례' };
const PROP_KO = { description: '설명', annotation: '풀이', text: '내용', title: '제목', kind: '종류', code: '코드', unit: '단위', severity: '심각도', rule: '규칙 식', clearRule: '해제 규칙', detectionMode: '감지 방식', holdSeconds: '지속 시간(초)', sopId: '절차 번호', target: '목표', direction: '좋은 방향', formula: '계산식', threshold: '임계값', order: '순서', tag: '태그' };
const groupOf = (label) => GROUPS.find((g) => g.labels.includes(label)) || GROUPS[2];

const side = document.getElementById('side');
let cy, data, hidden = new Set();

async function load() {
  side.innerHTML = `<div style="padding:18px;display:grid;gap:10px"><div class="skeleton sk-line" style="width:40%"></div><div class="skeleton sk-line" style="width:70%;height:18px"></div><div class="skeleton sk-line"></div><div class="skeleton sk-line" style="width:85%"></div></div>`;
  const asset = document.getElementById('asset').value;
  const [g, patterns] = await Promise.all([
    fetch(`/svc/agent/api/ontology/graph?asset=${encodeURIComponent(asset)}`).then((r) => { if (!r.ok) throw new Error('지식 지도를 읽지 못했습니다 (' + r.status + ')'); return r.json(); }),
    fetch('/svc/agent/api/ontology/patterns').then((r) => r.json()),
  ]);
  data = g;
  document.getElementById('path').innerHTML = '<option value="">이상 패턴 경로 · 전체</option>' + patterns.map((p) => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('');
  document.getElementById('stat').textContent = `항목 ${g.nodes.length} · 연결 ${g.edges.length}`;
  const deg = {}; g.edges.forEach((e) => { deg[e.from] = (deg[e.from] || 0) + 1; deg[e.to] = (deg[e.to] || 0) + 1; });
  const counts = {}; g.nodes.forEach((n) => { const k = groupOf(n.label).key; counts[k] = (counts[k] || 0) + 1; });
  document.getElementById('groups').innerHTML = GROUPS.filter((x) => counts[x.key]).map((x) => `<button type="button" class="cv-chip" aria-pressed="true" data-g="${x.key}" style="--c:${x.color}"><i></i>${x.title}<span class="num">${counts[x.key]}</span></button>`).join('');
  const ids = new Set(g.nodes.map((n) => n.id));
  const elements = [
    ...g.nodes.map((n) => { const gr = groupOf(n.label); const d = deg[n.id] || 0; return { data: { id: n.id, name: n.name || n.id, label: n.label, g: gr.key, color: gr.color, size: Math.round(14 + Math.min(26, Math.sqrt(d) * 5.2)), deg: d } }; }),
    ...g.edges.filter((e) => ids.has(e.from) && ids.has(e.to)).map((e, i) => ({ data: { id: 'e' + i, source: e.from, target: e.to, type: e.type } })),
  ];
  cy?.destroy();
  cy = cytoscape({ container: document.getElementById('cy'), elements, minZoom: 0.15, maxZoom: 3, boxSelectionEnabled: false,
    style: [
      { selector: 'node', style: { width: 'data(size)', height: 'data(size)', 'background-color': 'data(color)', 'background-opacity': 0.92, 'border-width': 1.5, 'border-color': '#16202d', label: 'data(name)', color: '#cfd8e3',
          'font-family': 'Pretendard Variable, sans-serif', 'font-size': 11, 'font-weight': 500, 'text-valign': 'bottom', 'text-margin-y': 5, 'text-max-width': 120, 'text-wrap': 'ellipsis', 'min-zoomed-font-size': 9,
          'text-outline-color': '#16202d', 'text-outline-width': 2, 'text-outline-opacity': 0.9, 'overlay-opacity': 0, 'transition-property': 'opacity, border-width, border-color', 'transition-duration': 180 } },
      { selector: 'node[deg >= 14]', style: { 'font-size': 12.5, 'font-weight': 600, color: '#ffffff', 'min-zoomed-font-size': 8, 'text-max-width': 220 } },
      { selector: 'edge', style: { width: 1, 'line-color': '#53637a', opacity: 0.38, 'curve-style': 'bezier', 'target-arrow-shape': 'triangle', 'target-arrow-color': '#53637a', 'arrow-scale': 0.7,
          'font-family': 'Geist Mono, monospace', 'font-size': 8.5, color: '#9aa7b5', 'text-rotation': 'autorotate', 'text-background-color': '#16202d', 'text-background-opacity': 0.9, 'text-background-padding': 2, 'overlay-opacity': 0,
          'transition-property': 'opacity, line-color, width', 'transition-duration': 180 } },
      { selector: 'node.gtitle', style: { width: 1, height: 1, 'background-opacity': 0, 'border-width': 0, label: 'data(name)', color: 'data(color)', 'font-size': 26, 'font-weight': 600, 'text-valign': 'top', 'text-margin-y': 0, 'text-max-width': 600, 'min-zoomed-font-size': 0, 'text-outline-width': 5, 'text-opacity': 0.92, events: 'no' } },
      { selector: '.dim', style: { opacity: 0.1, 'text-opacity': 0 } },
      { selector: 'edge.dim', style: { opacity: 0.04 } },
      { selector: 'node.near', style: { 'border-color': '#ffffff', 'border-width': 1.5, color: '#fff', 'min-zoomed-font-size': 0, 'font-size': 12, 'text-wrap': 'ellipsis', 'text-max-width': 170, 'z-index': 50 } },
      { selector: 'edge.near', style: { opacity: 0.95, width: 1.6, 'line-color': '#8b93ff', 'target-arrow-color': '#8b93ff', label: 'data(type)' } },
      { selector: 'node.pick', style: { 'border-color': '#ffffff', 'border-width': 3, 'underlay-color': '#8b93ff', 'underlay-opacity': 0.35, 'underlay-padding': 9, 'underlay-shape': 'ellipse', color: '#fff', 'font-size': 14, 'font-weight': 700, 'min-zoomed-font-size': 0, 'z-index': 99, 'text-wrap': 'none', 'text-valign': 'top', 'text-margin-y': -8 } },
      { selector: 'node.hit', style: { 'border-color': '#f5c46b', 'border-width': 3, color: '#f5c46b', 'min-zoomed-font-size': 0, 'font-size': 12.5, 'text-wrap': 'ellipsis', 'text-max-width': 260, 'z-index': 60 } },
      { selector: '.off', style: { display: 'none' } },
    ],
  });
  // 배치: 묶음마다 fcose 로 안을 놓고, 묶음을 정해 둔 자리에 둔다(묶음끼리 겹치면 밀어낸다). 같은 그래프는 늘 같은 자리에 놓이게 난수를 고정한다
  const rnd = Math.random; let seed = 20261114; Math.random = () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; };
  const WORLD = [cy.width() * 1.9, cy.height() * 1.9], boxes = [];
  for (const gr of GROUPS) {
    const ns = cy.nodes(`[g = "${gr.key}"]`); if (!ns.length) continue;
    ns.union(ns.edgesWith(ns)).layout({ name: 'fcose', quality: 'proof', randomize: true, animate: false, fit: false, nodeRepulsion: 3600, idealEdgeLength: 38, edgeElasticity: 0.4, gravity: 0.8, nodeSeparation: 40, packComponents: true, tile: true, numIter: 2500 }).run();
    const bb = ns.boundingBox({ includeLabels: false });
    boxes.push({ gr, ns, cx: gr.at[0] * WORLD[0], cy: gr.at[1] * WORLD[1], r: Math.max(bb.w, bb.h) / 2 + 34, ox: bb.x1 + bb.w / 2, oy: bb.y1 + bb.h / 2 });
  }
  Math.random = rnd;
  for (let k = 0; k < 80; k++) for (const a of boxes) for (const b of boxes) { if (a === b) continue; const dx = b.cx - a.cx, dy = b.cy - a.cy, d = Math.hypot(dx, dy) || 1, need = a.r + b.r; if (d < need) { const m = (need - d) / 2 / d; a.cx -= dx * m; a.cy -= dy * m; b.cx += dx * m; b.cy += dy * m; } }
  for (const b of boxes) { b.ns.shift({ x: b.cx - b.ox, y: b.cy - b.oy }); cy.add({ group: 'nodes', data: { id: 'title:' + b.gr.key, name: `${b.gr.title} ${b.ns.length}`, color: b.gr.color, g: b.gr.key }, classes: 'gtitle', position: { x: b.cx, y: b.cy - b.r + 22 }, selectable: false, grabbable: false }); }
  cy.fit(undefined, 48);
  // 글자는 확대 배율과 상관없이 화면에서 같은 크기로 보이게 한다(묶음 이름 · 고른 항목 · 이어진 항목 · 선 이름)
  let raf = 0; const restyle = () => { raf = 0; const z = cy.zoom(); cy.style().selector('node.gtitle').style('font-size', 13 / z).selector('node[deg >= 14]').style('font-size', Math.max(12.5, 10.5 / z)).selector('node.near').style({ 'font-size': Math.max(12, 11.5 / z), 'text-max-width': 170 / Math.min(1, z) }).selector('node.hit').style('font-size', Math.max(12.5, 11.5 / z)).selector('node.pick').style('font-size', Math.max(14, 14 / z)).selector('edge.near').style({ 'font-size': Math.max(8.5, 8.5 / z), width: Math.max(1.6, 1.4 / z) }).update(); };
  cy.on('zoom', () => { if (!raf) raf = requestAnimationFrame(restyle); }); restyle();
  cy.on('tap', 'node', (e) => { if (!e.target.hasClass('gtitle')) select(e.target.id()); });
  cy.on('tap', (e) => { if (e.target === cy) select(null); });
  cy.on('mouseover', 'node', () => { document.getElementById('cy').style.cursor = 'pointer'; });
  cy.on('mouseout', 'node', () => { document.getElementById('cy').style.cursor = ''; });
  const want = new URLSearchParams(location.search).get('pick');
  select(want && cy.getElementById(want).length ? want : null);
}

function focus(eles, max = 1.25) { const bb = eles.boundingBox(), z = Math.min(max, (cy.width() - 160) / bb.w, (cy.height() - 200) / bb.h); cy.animate({ zoom: z, pan: { x: cy.width() / 2 - (bb.x1 + bb.w / 2) * z, y: cy.height() / 2 - (bb.y1 + bb.h / 2) * z }, duration: 380, easing: 'ease-out-cubic' }); }
function clearMarks() { cy.elements().removeClass('dim near pick hit'); }
function select(id) {
  clearMarks(); document.getElementById('q').value = ''; document.getElementById('path').value = '';
  if (!id) { overview(); return; }
  const n = cy.getElementById(id), hood = n.closedNeighborhood();
  cy.elements().not(hood).addClass('dim'); hood.addClass('near'); n.removeClass('near').addClass('pick');
  focus(hood);
  detail(id);
}
function overview() {
  const top = cy.nodes().not('.gtitle').sort((a, b) => b.data('deg') - a.data('deg')).slice(0, 8);
  side.innerHTML = `<section class="empty" style="padding:28px 18px 8px"><header><figure>${icon('network')}</figure><h3>항목을 골라 보세요</h3><p>지도에서 점을 누르면 그 항목의 속성과 이어진 항목이 여기에 보입니다.</p></header></section>
    <div class="node-sec" style="border-top:1px solid var(--border)"><h3>가장 많이 이어진 항목</h3><div class="chips">${top.map((n) => `<button type="button" class="chip" data-id="${esc(n.id())}" style="--c:${n.data('color')}"><i></i><span>${esc(n.data('name'))}</span><span class="num muted">${n.data('deg')}</span></button>`).join('')}</div></div>`;
}
function detail(id) {
  const n = data.nodes.find((x) => x.id === id), gr = groupOf(n.label);
  const known = Object.entries(n.props || {}).filter(([k, v]) => PROP_KO[k] && k !== 'name' && v !== '' && v != null);
  const rest = Object.entries(n.props || {}).filter(([k]) => !PROP_KO[k] && k !== 'name' && k !== 'id');
  const out = {}, inn = {};
  data.edges.forEach((e) => { if (e.from === id) (out[e.type] ||= []).push(e.to); if (e.to === id) (inn[e.type] ||= []).push(e.from); });
  const chip = (nid) => { const m = data.nodes.find((x) => x.id === nid); if (!m) return ''; return `<button type="button" class="chip" data-id="${esc(nid)}" style="--c:${groupOf(m.label).color}"><i></i><span>${esc(m.name || nid)}</span></button>`; };
  const rels = (obj, dir) => Object.entries(obj).map(([t, list]) => `<div class="rel"><div class="rel-name">${icon(dir === 'out' ? 'arrow-right' : 'arrow-left')}<span class="mono">${esc(t)}</span><span class="num">${list.length}</span></div><div class="chips">${list.slice(0, 12).map(chip).join('')}${list.length > 12 ? `<span class="chip">+${list.length - 12}</span>` : ''}</div></div>`).join('');
  const total = Object.values(out).flat().length + Object.values(inn).flat().length;
  side.innerHTML = `<div class="node-head fade-in"><span class="gtag" style="--c:${gr.color}"><i></i>${gr.title} · ${LABEL_KO[n.label] || n.label}</span><h2>${esc(n.name || n.id)}</h2><p class="mono">${esc(n.id)}</p></div>
    ${known.length ? `<div class="node-sec"><dl class="kv">${known.map(([k, v]) => `<dt>${PROP_KO[k]}</dt><dd>${esc(typeof v === 'object' ? JSON.stringify(v) : v)}</dd>`).join('')}</dl></div>` : ''}
    <div class="node-sec"><h3>이어진 항목<span class="num">${total}</span></h3>${rels(out, 'out')}${rels(inn, 'in')}</div>
    ${rest.length ? `<div class="node-sec" style="padding-block:4px"><details class="fold" style="border:0"><summary>그 밖의 속성<span class="muted num">${rest.length}</span></summary><div class="fold-body" style="padding-left:0"><dl class="kv" style="font-size:12.5px">${rest.map(([k, v]) => `<dt class="mono">${esc(k)}</dt><dd style="word-break:break-all">${esc(typeof v === 'object' ? JSON.stringify(v) : v)}</dd>`).join('')}</dl></div></details></div>` : ''}`;
  side.scrollTop = 0;
}
side.addEventListener('click', (e) => { const c = e.target.closest('[data-id]'); if (c) select(c.dataset.id); });

// 찾기: 이름이 맞는 항목만 밝게
document.getElementById('q').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase(); clearMarks(); document.getElementById('path').value = '';
  if (!q) { overview(); return; }
  const hit = cy.nodes().not('.gtitle').filter((n) => String(n.data('name')).toLowerCase().includes(q));
  cy.elements().not(hit).addClass('dim'); hit.addClass('hit');
  document.getElementById('stat').textContent = `찾은 항목 ${hit.length}`;
  if (hit.length) focus(hit, 1.1);
});
document.getElementById('q').addEventListener('keydown', (e) => { if (e.key === 'Enter') { const first = cy.nodes('.hit')[0]; if (first) select(first.id()); } });
// 이상 패턴 경로: 패턴에서 증상 · 원인 · 조치 방법까지 이어지는 길만 밝게
document.getElementById('path').addEventListener('change', (e) => {
  clearMarks(); const id = e.target.value; if (!id || !cy.getElementById(id).length) { overview(); return; }
  const start = cy.getElementById(id); let seen = start, frontier = start;
  for (let d = 0; d < 2; d++) { frontier = frontier.neighborhood('node').filter((n) => ['diagnosis', 'skill'].includes(n.data('g'))).difference(seen); seen = seen.union(frontier); }
  const edges = seen.edgesWith(seen); const all = seen.union(edges);
  cy.elements().not(all).addClass('dim'); all.addClass('near'); start.removeClass('near').addClass('pick');
  focus(all, 1.1); detail(id);
});
document.getElementById('groups').addEventListener('click', (e) => { const b = e.target.closest('.cv-chip'); if (!b) return; const on = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', on); cy.nodes(`[g = "${b.dataset.g}"]`).toggleClass('off', !on); });
window.__path = (v) => { const i = document.getElementById('path'); i.value = v; i.dispatchEvent(new Event('change')); };
document.getElementById('zi').onclick = () => cy.zoom({ level: cy.zoom() * 1.25, renderedPosition: { x: cy.width() / 2, y: cy.height() / 2 } });
document.getElementById('zo').onclick = () => cy.zoom({ level: cy.zoom() / 1.25, renderedPosition: { x: cy.width() / 2, y: cy.height() / 2 } });
document.getElementById('fit').onclick = () => cy.animate({ fit: { padding: 48 }, duration: 300 });
document.getElementById('asset').addEventListener('change', load);
document.getElementById('reload').addEventListener('click', load);
window.__q = (v) => { const i = document.getElementById('q'); i.value = v; i.dispatchEvent(new Event('input')); };
