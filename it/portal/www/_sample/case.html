<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>처리 건 — 견본</title>
<link rel="stylesheet" href="../vendor/basecoat/basecoat.min.css">
<link rel="stylesheet" href="../vendor/bpmn-js/diagram-js.css">
<link rel="stylesheet" href="../vendor/bpmn-js/bpmn-js.css">
<link rel="stylesheet" href="../vendor/bpmn-js/bpmn-font/css/bpmn.css">
<link rel="stylesheet" href="portal-kit.css">
<style>
  .case-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .case-head h2 { font-size: 20px; line-height: 28px; font-weight: 650; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .case-meta { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted-foreground); }
  .case-meta span { display: inline-flex; align-items: center; gap: 5px; }
  .case-meta .ic { width: 13px; height: 13px; }
  .flow-canvas { height: 360px; }
  .rest { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; color: var(--muted-foreground); font-size: 13px; }
  .rest .ic { width: 12px; height: 12px; color: var(--ink-4); }
  dialog.flow-dialog > div { width: min(1400px, calc(100vw - 48px)); max-width: none; padding: 0; overflow: hidden; background: var(--cv-bg); border-color: var(--cv-border); }
  dialog.flow-dialog .canvas { height: min(760px, calc(100vh - 96px)); border: 0; border-radius: 0; }
</style>
</head>
<body data-menu="instances" data-view="instances">
<main>
  <div class="page">
    <div class="page-head">
      <div><h1>처리 건</h1><p>사건 하나가 한 건으로 열리고, AI 판단 · 내 승인 · 실행 결과가 이 한 곳에 남습니다.</p></div>
      <div class="page-tools">
        <div class="seg" role="group" aria-label="상태로 거르기" id="caseFilter"></div>
      </div>
    </div>

    <div class="split">
      <div class="rows" id="caseList" aria-label="처리 건 목록"></div>
      <section id="caseDetail" aria-live="polite"></section>
    </div>
  </div>
</main>

<dialog id="flowDialog" class="dialog flow-dialog" aria-label="전체 흐름" onpointerdown="this.dataset.backdropPress = event.target === this" onclick="if (event.target === this && this.dataset.backdropPress === 'true') this.close()">
  <div><div class="canvas"><div class="canvas-bar"><span class="cv-legend" id="flowLegend2"></span><span class="grow"></span><span class="cv-tools"><button type="button" class="wide" onclick="this.closest('dialog').close()">닫기</button></span></div><div class="bpmn" id="flowBig"></div></div></div>
</dialog>

<script src="../vendor/basecoat/basecoat.min.js" defer></script>
<script src="../vendor/bpmn-js/bpmn-navigated-viewer.production.min.js"></script>
<script src="../vendor/prism/prism.min.js" data-manual></script>
<script type="module">
import { mountShell, icon, esc, toast } from './shell.js';
mountShell();

const RUNNING = new URLSearchParams(location.search).get('state') === 'running';
const fx = await fetch('data/case-fixtures.json').then((r) => r.json());
const xml = await fetch('data/cooling-emergency.bpmn').then((r) => r.text());
const S = fx.scenarios;
const hhmmss = (iso) => { const d = new Date(iso); return [d.getHours(), d.getMinutes(), d.getSeconds()].map((x) => String(x).padStart(2, '0')).join(':'); };
const dur = (a, b) => { const s = Math.round((new Date(b) - new Date(a)) / 1000); return s >= 60 ? `${Math.floor(s / 60)}분 ${s % 60}초` : `${s}초`; };

// ── 목록 ──
const LIST = [
  { key: 'waiting', title: '냉각 긴급 대응 · HYD-01', meta: '03:05 시작 · 운전원 승인 단계', tone: RUNNING ? 'brand' : 'warn', tag: RUNNING ? 'AI 판단 중' : '승인 대기', ic: RUNNING ? 'bot' : 'user-check', mine: !RUNNING },
  { key: 'stuck', title: '냉각 긴급 대응 · HYD-03', meta: '03:05 시작 · 원인 진단 단계에서 멈춤', tone: 'danger', tag: '멈춤', ic: 'triangle-alert' },
  { key: 'rejected', title: '냉각 긴급 대응 · HYD-02', meta: '03:05 시작 · 반려로 끝남', tone: '', tag: '반려', ic: 'circle-x' },
  { key: 'done', title: '냉각 긴급 대응 · HYD-01', meta: '어제 21:40 시작 · 유온 정상으로 끝남', tone: 'ok', tag: '완료', ic: 'circle-check' },
  { key: 'manual', title: '매뉴얼 추출 제안 · HM-8 쿨러 팬', meta: '03:01 시작 · 검토할 제안 12건', tone: 'ok', tag: '완료', ic: 'file-text' },
];
document.getElementById('caseFilter').innerHTML = [['전체', 5, true], ['내 할 일', RUNNING ? 0 : 1], ['진행 중', 2], ['끝남', 3]]
  .map(([n, c, on]) => `<button type="button" aria-pressed="${!!on}">${n}<span class="num">${c}</span></button>`).join('');
document.getElementById('caseList').innerHTML = LIST.map((r, i) => `<button type="button" class="row" ${i === 0 ? 'aria-current="true"' : ''}>
  <span class="row-ic">${icon(r.ic)}</span><span class="row-title">${esc(r.title)}</span><span class="tag" ${r.tone ? `data-tone="${r.tone}"` : ''}>${r.tag}</span>
  <span class="row-meta">${esc(r.meta)}</span></button>`).join('');

// ── 한 건 ──
const W = S.waiting, V = W.view, D = W.decision, pick = D.options[0];
const agentWi = V.workitems.find((w) => w.activity_id === 'T_agent');
const alert = V.instance.variables_data.find((v) => v.key === 'alert').value;

const turn = () => `<section class="turn fade-in" aria-labelledby="turnTitle">
  <div class="turn-head"><span class="turn-badge">${icon('user-check', 'ic-lg')}</span>
    <div><div class="turn-eyebrow">내가 할 일 · 승인<span class="late">${icon('clock', 'ic-sm')} 기한 지남</span></div>
      <h3 id="turnTitle">「${esc(pick.name)}」을 승인할까요?</h3>
      <p class="turn-why">AI 에이전트가 후보 ${D.options.length}개를 비교해 이 조치를 권했습니다. 승인하면 시스템이 팬을 100 %로 올리고 유온을 다시 잽니다.</p></div></div>
  <dl class="turn-facts">
    <div><dt>지금 유온</dt><dd class="num">${alert.evidence.ts1}<small>℃</small></dd></div>
    <div><dt>조치 뒤 예측 유온</dt><dd class="num"><span class="up">49.8</span><small>℃</small></dd></div>
    <div><dt>오더 납기까지</dt><dd class="num">${D.facts.order_due_h}<small>시간</small></dd></div>
    <div><dt>납기 지연 손실</dt><dd class="num">${D.facts.order_penalty_per_h}<small>만원/시간</small></dd></div>
  </dl>
  <div class="turn-foot">
    <button type="button" class="btn" id="approve">${icon('check')}승인</button>
    <button type="button" class="btn" data-variant="outline" id="reject">반려</button>
    <button type="button" class="btn" data-variant="ghost">다른 후보 고르기</button>
    <span class="who">운전원 역할로 기록됩니다</span>
  </div></section>`;

const waitNote = () => `<div class="wait-note fade-in">${icon('bot', 'ic-lg')}<span><b>AI 에이전트가 판단하는 중입니다.</b> 끝나면 승인 요청이 이 자리에 뜹니다.</span></div>`;

const evidence = () => `<ul class="evid">
  <li>${icon('thermometer')}<span><b>유온 ${alert.evidence.ts1} ℃, 냉각 효율 ${alert.evidence.ce} %</b> — 부하 ${alert.evidence.load} %에서 냉각 효율이 기준(60 %)보다 낮습니다.</span></li>
  <li>${icon('network')}<span>지식 지도의 원인 후보 가운데 <b>쿨러 핀 오염</b>이 관측값과 맞습니다(고장 형태: ${esc(D.facts.failure_mode_name)}).</span></li>
  <li>${icon('scale')}<span>생산을 유지하는 조치가 납기 손실(${D.facts.order_penalty_per_h}만원/시간)을 피해 순위 식에서 <b class="num">+1.12</b>점을 받았습니다.</span></li></ul>`;

const options = () => `<table class="opts"><thead><tr><th></th><th>후보</th><th>종류</th><th>점수</th><th></th><th>승인 역할</th></tr></thead><tbody>${
  D.options.map((o) => `<tr ${o.rank === 1 ? 'data-pick' : ''}><td><span class="rank num">${o.rank}</span></td><td><b>${esc(o.name)}</b> <span class="muted mono">${esc(o.sopId)}</span></td>
    <td>${o.kind === 'control' ? '설비 명령' : '작업지시'}</td><td class="num">${o.score.toFixed(2)}</td><td><div class="bar"><i style="width:${Math.round(o.score / 3.38 * 100)}%"></i></div></td><td>${esc(o.approver?.name || '운전원')}</td></tr>`).join('')}</tbody></table>`;

// 실행 기록(도구 호출 한 줄씩) — 본보기의 실제 사건 순서 그대로
const TOOL = { Read: ['file-text', '스킬 문서를 읽었습니다', 'cooling-emergency-response/SKILL.md'], 'mcp__hyd-dmn__diagnose': ['network', '원인을 진단했습니다', 'hyd-dmn · diagnose → 쿨러 핀 오염'],
  'mcp__hyd-dmn__evaluate_cards': ['scale', '조치 후보 4개를 비교했습니다', 'hyd-dmn · evaluate_cards → 1위 SOP-COOL-11 (3.38점)'], 'mcp__hyd-dmn__submit_decision': ['send', '판단을 제출했습니다', 'hyd-dmn · submit_decision → ' + D.id],
  Write: ['file-json', '결과를 적었습니다', 'output/result.json'] };
const toolEvents = V.events.filter((e) => e.event_type === 'tool_usage_finished');
const line = (e, extra = '') => { const [ic, text, sub] = TOOL[e.data.tool] || ['terminal', e.data.tool, '']; return `<div class="line" data-kind="tool" ${extra}>${icon(ic)}<span class="line-text"><b>${text}</b><span class="line-sub">${esc(sub)}</span></span><span class="line-time num">${hhmmss(e.timestamp)}</span></div>`; };
const execFold = () => `<details class="fold"><summary>실행 기록<span class="muted">도구 호출 ${toolEvents.length}번 · ${dur(agentWi.start_date, agentWi.end_date)}</span></summary><div class="fold-body" style="padding-left:0">
  <div class="stream-log" style="max-height:none;padding:0">${toolEvents.map((e) => line(e)).join('')}</div>
  <details class="fold"><summary>제출한 판단 원문 (JSON)</summary><div class="fold-body" style="padding-left:0"><pre class="code"><code class="language-json">${esc(JSON.stringify({ decision_id: D.id, recommended: D.recommended, cause: D.facts.cause, failure_mode: D.facts.failure_mode, score: pick.score, scoreParts: pick.scoreParts }, null, 2))}</code></pre></div></details>
</div></details>`;

const aiDone = () => `<div class="step-card">
  <div class="result"><div class="result-label">${icon('sparkles', 'ic-sm')}결론</div>
    <div class="result-main">쿨러 핀 오염으로 냉각 성능이 떨어졌습니다. 「${esc(pick.name)}」을 권합니다.</div>
    <div class="result-sub">예측 유온 49.8 ℃. 인터록 여유와 작동유 수명이 늘고, 전력 사용량이 늘어납니다.</div></div>
  <details class="fold" open><summary>근거<span class="muted">관측값 · 지식 지도 · 순위 식</span></summary><div class="fold-body">${evidence()}</div></details>
  <details class="fold"><summary>후보 비교<span class="muted">${D.options.length}개 가운데 1위</span></summary><div class="fold-body" style="padding-left:0">${options()}</div></details>
  ${execFold()}</div>`;

const PHASES = ['스킬 읽기', '원인 진단', '후보 비교', '판단 제출', '결과 작성'];
const aiLive = () => `<div class="stream" id="live">
  <div class="stream-head"><i class="dot" data-tone="brand" data-live></i><b>냉각 긴급 대응 에이전트</b><span class="muted">가 일하는 중</span><span class="elapsed num" id="liveClock">0:00</span></div>
  <div class="stream-phases" id="livePhases">${PHASES.map((p, i) => `<span class="phase" data-state="${i === 0 ? 'now' : 'todo'}"><i></i>${p}</span>`).join('')}</div>
  <div class="stream-log" id="liveLog"></div></div>`;

const step = (state, ic, title, who, whoIc, time, body) => `<div class="step" data-state="${state}"><span class="step-mark">${icon(ic)}</span>
  <div class="step-head"><span class="step-title">${title}</span><span class="step-who">${icon(whoIc)}${who}</span><span class="step-time num">${time}</span></div>
  ${body ? `<div class="step-body">${body}</div>` : ''}</div>`;

document.getElementById('caseDetail').innerHTML = `
  <div class="case-head"><div>
    <h2>${esc(V.instance.proc_inst_name)}<span class="tag" data-tone="${RUNNING ? 'brand' : 'warn'}">${RUNNING ? 'AI 판단 중' : '승인 대기'}</span></h2>
    <div class="case-meta"><span>${icon('triangle-alert')}${esc(alert.name)}</span><span>${icon('clock')}11월 14일 03:05 시작</span><span>${icon('route')}6단계 가운데 ${RUNNING ? 1 : 2}번째</span><span class="mono">${esc(alert.alertId)}</span></div></div>
    <div class="dropdown-menu" id="caseMore"><button type="button" class="btn" data-variant="outline" data-size="icon-sm" id="caseMore-trigger" aria-haspopup="menu" aria-controls="caseMore-menu" aria-expanded="false" aria-label="더 보기">${icon('ellipsis')}</button>
      <div id="caseMore-popover" data-popover aria-hidden="true" data-align="end"><div role="menu" id="caseMore-menu" aria-labelledby="caseMore-trigger"><div role="menuitem">${icon('refresh-cw')}다시 읽기</div><div role="menuitem">${icon('file-json')}처리 기록 원문</div><hr role="separator"><div role="menuitem">${icon('square')}이 건 닫기</div></div></div></div>
  </div>
  ${RUNNING ? waitNote() : turn()}
  <div class="sec-head"><h2>진행 길</h2><span class="muted">흐름 「냉각 긴급 대응」 v1 · 끌어서 옮기고 휠로 확대합니다</span></div>
  <div class="canvas flow-canvas"><div class="canvas-bar"><span class="cv-legend" id="flowLegend"><span><i style="background:var(--cv-green)"></i>끝남</span><span><i style="background:var(--cv-now)"></i>지금</span><span><i></i>남음</span></span><span class="grow"></span>
    <span class="cv-tools"><button type="button" id="zOut" aria-label="축소">${icon('minus')}</button><button type="button" id="zIn" aria-label="확대">${icon('plus')}</button><button type="button" id="zNow" aria-label="지금 단계로">${icon('locate-fixed')}</button><button type="button" class="wide" id="zAll">${icon('maximize-2')}전체 흐름</button></span></div>
    <div class="bpmn" id="flow"></div></div>
  <div class="sec-head"><h2>단계 기록</h2><span class="muted" style="display:inline-flex;align-items:center;gap:6px"><i class="dot" data-tone="ok" data-live></i>새 단계가 아래에 붙습니다</span></div>
  <div class="steps">
    ${step('done', 'check', '센서 경보로 시작', '경보 감지기', 'activity', '03:05:29', `<p class="step-say">HYD-01의 유온이 ${alert.evidence.ts1} ℃까지 오르고 냉각 효율이 ${alert.evidence.ce} %로 떨어져 「${esc(alert.name)}」 경보가 났습니다.</p>`)}
    ${RUNNING
      ? step('now', 'bot', '원인 진단 · 냉각 조치 제안', '냉각 긴급 대응 에이전트', 'bot', '03:05:31 시작', aiLive())
      : step('done', 'check', '원인 진단 · 냉각 조치 제안', '냉각 긴급 대응 에이전트', 'bot', `03:05:31 · ${dur(agentWi.start_date, agentWi.end_date)}`, aiDone())}
    ${RUNNING
      ? step('todo', 'user', '운전원 승인', '담당자', 'user', '', '')
      : step('now', 'user-check', '운전원 승인', '담당자 · 내 차례', 'user', '03:07:18부터 기다림', '<p class="step-say">위의 「내가 할 일」에서 승인하거나 반려하면 다음 단계로 넘어갑니다.</p>')}
    ${step('todo', 'circle-dashed', '남은 단계', '', 'cog', '', `<div class="rest"><span>냉각 명령</span>${icon('arrow-right')}<span>재관측</span>${icon('arrow-right')}<span>작업지시 등록</span>${icon('arrow-right')}<span>결과 보고</span></div>`).replace('<span class="step-who">' + icon('cog') + '</span>', '')}
  </div>`;
if (window.Prism) Prism.highlightAllUnder(document.getElementById('caseDetail'));

// ── 흐름 그림: bpmn-js NavigatedViewer(보기 전용). 색만 어두운 캔버스에 맞춘다 ──
const css = getComputedStyle(document.documentElement);
const cv = (n) => css.getPropertyValue(n).trim();
const viewerOptions = (container) => ({ container, bpmnRenderer: { defaultFillColor: cv('--cv-node'), defaultStrokeColor: '#8493a8', defaultLabelColor: cv('--cv-ink') }, textRenderer: { defaultStyle: { fontFamily: 'Pretendard Variable, sans-serif', fontSize: 13 }, externalStyle: { fontSize: 12 } } });
const DONE = RUNNING ? ['Start', 'F1'] : ['Start', 'F1', 'T_agent', 'F2'];
const NOW = RUNNING ? 'T_agent' : 'T_approve';
async function draw(container, focus) {
  const viewer = new BpmnJS(viewerOptions(container));
  await viewer.importXML(xml);
  const canvas = viewer.get('canvas'), reg = viewer.get('elementRegistry'), overlays = viewer.get('overlays');
  reg.forEach((el) => { if (el.type === 'bpmn:Lane' || el.type === 'label' || el.id === 'Process_A') return; canvas.addMarker(el.id, DONE.includes(el.id) ? 'is-done' : el.id === NOW ? 'is-now' : 'is-todo'); });
  DONE.filter((id) => reg.get(id)?.type?.endsWith('Task') || id === 'T_agent').forEach((id) => overlays.add(id, { position: { top: -8, right: 10 }, html: '<div class="bpmn-check"></div>' }));
  const now = reg.get(NOW);
  overlays.add(NOW, { position: { top: -12, left: now.width / 2 }, html: `<div class="bpmn-tip"><i></i>${RUNNING ? '지금 · AI 판단 중' : '지금 · 내 차례'}</div>` });
  const toNow = () => { const o = canvas.viewbox().outer, z = 0.78, w = o.width / z, h = o.height / z; canvas.viewbox({ x: Math.max(20, now.x + now.width / 2 - w * 0.4), y: -22, width: w, height: h }); };
  if (focus) toNow(); else canvas.zoom('fit-viewport', 'auto');
  return { canvas, toNow };
}
const flow = await draw(document.getElementById('flow'), true);
document.getElementById('zIn').onclick = () => flow.canvas.zoom(flow.canvas.zoom() * 1.2);
document.getElementById('zOut').onclick = () => flow.canvas.zoom(flow.canvas.zoom() / 1.2);
document.getElementById('zNow').onclick = flow.toNow;
let big = null;
document.getElementById('zAll').onclick = async () => { document.getElementById('flowLegend2').innerHTML = document.getElementById('flowLegend').innerHTML; document.getElementById('flowDialog').showModal(); if (!big) big = await draw(document.getElementById('flowBig'), false); };
if (new URLSearchParams(location.search).get('flow') === 'all') document.getElementById('zAll').click();

document.getElementById('approve')?.addEventListener('click', () => toast('승인했습니다', '냉각 명령 단계로 넘어갑니다.'));
document.getElementById('reject')?.addEventListener('click', () => toast('견본 화면입니다', '반려 사유를 묻는 대화상자가 열리는 자리입니다.', 'info'));

// ── 실시간: 본보기의 실제 사건 순서를 시간 간격을 줄여 다시 흘린다(견본에서만 — 포털에서는 SSE 가 같은 자리에 붙인다) ──
if (RUNNING) {
  const log = document.getElementById('liveLog'), phases = [...document.querySelectorAll('#livePhases .phase')], clock = document.getElementById('liveClock');
  const t0 = Date.now(); setInterval(() => { const s = Math.floor((Date.now() - t0) / 1000) + 8; clock.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }, 500);
  const upto = Number(new URLSearchParams(location.search).get('upto') || 99);
  const starts = V.events.filter((e) => e.event_type === 'tool_usage_started');
  const setPhase = (i) => phases.forEach((p, k) => { p.dataset.state = k < i ? 'done' : k === i ? 'now' : 'todo'; });
  let i = 0;
  const next = () => {
    if (i >= starts.length || i >= upto) return;
    const s = starts[i], [ic, , sub] = TOOL[s.data.tool]; const doing = ['스킬 문서를 읽는 중', '원인을 진단하는 중', '조치 후보를 비교하는 중', '판단을 제출하는 중', '결과를 적는 중'][i];
    setPhase(i);
    log.insertAdjacentHTML('beforeend', `<div class="line" data-kind="tool" data-new data-pending>${icon(ic)}<span class="line-text"><b>${doing}</b><span class="line-sub">${esc(sub.split(' → ')[0])}</span></span><span class="line-time num">${hhmmss(s.timestamp)}</span></div>`);
    log.scrollTop = log.scrollHeight;
    if (i + 1 >= upto) return;
    setTimeout(() => { log.lastElementChild.outerHTML = line(toolEvents[i]).replace('data-kind="tool"', 'data-kind="ok"').replace(/<svg[\s\S]*?<\/svg>/, icon('check')); i += 1; next(); }, 1400);
  };
  setTimeout(next, 500);
}
</script>
</body>
