<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- 녹화 브라우저 전용 글꼴 설정(browser.mjs가 FONTCONFIG_FILE로 준다): 학생 Windows 크롬처럼 고르게 한다.
     클라우드 VM 이미지의 /etc/fonts/conf.d/56-prefer-inter.conf는 -apple-system · BlinkMacSystemFont · Segoe UI · system-ui · sans-serif를
     Inter로 바꾸므로, 포털 글꼴 목록(theme.css의 font 값) 맨 앞의 -apple-system에서 영문 · 숫자가 Inter로 그려졌다. Windows에는 그 이름들이 없어
     목록의 "Malgun Gothic"까지 내려가 한글 · 영문 모두 맑은 고딕으로 그려진다. 그래서 시스템 conf.d를 읽지 않고 글꼴 폴더와 기본 sans-serif만 둔다. -->
<fontconfig>
  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>
  <cachedir>/var/cache/fontconfig</cachedir>
  <!-- 기본 글꼴 이름(sans-serif · sans · system-ui)은 맑은 고딕으로 강하게 바꾼다. 시스템 conf.d가 빠지면 alias만으로는 약하게 걸려 FreeSerif로 갔다 -->
  <match target="pattern"><test name="family"><string>sans-serif</string></test><edit name="family" mode="prepend" binding="strong"><string>Malgun Gothic</string></edit></match>
  <match target="pattern"><test name="family"><string>sans</string></test><edit name="family" mode="prepend" binding="strong"><string>Malgun Gothic</string></edit></match>
  <match target="pattern"><test name="family"><string>system-ui</string></test><edit name="family" mode="prepend" binding="strong"><string>Malgun Gothic</string></edit></match>
  <!-- 고정폭(원문 칸 pre · 원문 JSON): Windows는 Consolas(한글은 맑은 고딕)로 그린다. Consolas는 무료 글꼴이 아니라 가장 가까운 DejaVu Sans Mono로 대신하고 한글은 맑은 고딕으로 잇는다 -->
  <match target="pattern"><test name="family"><string>monospace</string></test><edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans Mono</string><string>Malgun Gothic</string></edit></match>
  <match target="pattern"><test name="family"><string>ui-monospace</string></test><edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans Mono</string><string>Malgun Gothic</string></edit></match>
  <match target="pattern"><test name="family"><string>Consolas</string></test><edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans Mono</string><string>Malgun Gothic</string></edit></match>
  <!-- 그 밖의 글꼴에서 한글이 빠지면(글자별 대체) 학생 Windows처럼 맑은 고딕으로 잇는다 -->
  <match target="pattern"><test name="lang" compare="contains"><string>ko</string></test><edit name="family" mode="append" binding="strong"><string>Malgun Gothic</string></edit></match>
</fontconfig>
