# 시스템 테스트. 실행(저장소 루트, Git Bash) — 실제 DB는 HYD_TEST_DSN 하나, 화면 순회는 HYD_TEST_PORTAL_URL(tests/conftest.py 머리말):
#   . workspace/개발/scripts/host_libpq.sh; HYD_TEST_DSN=postgresql://postgres:postgres@127.0.0.1:64322/hyd_test HYD_TEST_PORTAL_URL=http://127.0.0.1:8088 PYTHONUTF8=1 .venv314/Scripts/python.exe -m pytest -c workspace/개발/pytest.ini workspace/개발/tests
[pytest]
testpaths = tests
pythonpath = ../../common ../../it/process ../../it/agent-worker ../../it/agent ../../scripts ../../it/enterprise-sim ../../it/effects-mcp
addopts = -q -rfE -p no:cacheprovider
